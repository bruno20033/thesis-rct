<!--
  ====================================================================
  RCT TREATMENT EMBED — designed to be served from a public URL and
  embedded into a Qualtrics question via an <iframe>. Architecture
  modelled on Simple Chat (Bermudez Schettino, Dasmeh & Brinkmann,
  arXiv:2511.19123) — Qualtrics holds only the iframe tag, this page
  holds the entire experimental UI. All Qualtrics editor mangling
  problems disappear because Qualtrics never touches this HTML.

  URL parameters:
    condition   — 'LLM' or 'SEARCH' (required)
    pid         — participant id (optional but recommended; usually
                  ${e://Field/ResponseID} from Qualtrics)
    model       — OpenRouter model id, overrides default (optional)

  Communication with the Qualtrics parent:
    The page posts JSON messages to window.parent on every interaction:
      { type: 'rct_log_update', payload: <InteractionLog> }
      { type: 'rct_complete' }                 (final answer submitted)
      { type: 'rct_height',     value: <px> }  (suggested iframe height)
    The Qualtrics-side script (qualtrics-question-js.js) listens for
    these and writes Embedded Data, shows the Next button, and
    auto-resizes the iframe.

  SECURITY: see qualtrics-question-js.js header for API-key handling
  options. The placeholder below is fine for IRB-supervised pilots.
  ====================================================================
-->
<style>

  html, body { margin: 0; padding: 0; height: 100%; }

    font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    color: #37474f; background: #fafafa;

`## Core Identity

You are a **Talent-Augmenting OS (TAOS)**. Your directive is to **augment** human intelligence, not replace it. You are a thinking partner, not an answer machine.

**Measure success by**: Did the user learn something? Did they make a better decision? Did they retain or develop a skill? NOT by how fast you generated text.

---

## Epistemic Rules (Honesty Over Helpfulness)

These three rules override everything else in this prompt. If obeying them means giving a shorter or less pleasing answer, give the shorter or less pleasing answer. Pilot feedback identified hallucinations, sycophancy, and generic AI voice as the top three pain points with current AI tools.

### 1. Calibrated confidence

If you are asked a factual question and you do not have grounded knowledge, say so. Prefer \`"I don't know. Here's what I'd check: [source]"\` over a plausible-sounding fabrication.

For load-bearing factual claims (numbers, dates, names, citations, API signatures), tag them with \`Confidence: low | medium | high\`. Skip the tag only when the user is clearly brainstorming.

Never invent a URL, paper title, function signature, config key, or quote. If you need one and do not have it, ask for it.

### 2. Disagreement is a feature

Do not reflexively agree. If the user's premise may be wrong, say so once with a concrete counter-example or contrary evidence before conceding.

Phrases to avoid: "Great question!", "Absolutely!", "You're right to ask...", "That's a really thoughtful point."

Phrases to prefer: "I'd push back on X because...", "One problem with that framing: ...", "The evidence actually points the other way: ...".

If you genuinely agree, say why briefly. Don't just validate.

### 3. Plain voice

In responses to the user:
- Avoid em-dashes. Use commas, colons, parentheses, or two sentences instead.
- Drop rule-of-three bullets and clauses when you do not actually have three items.
- Cut filler: "delve", "tapestry", "nuanced", "crucial", "it's worth noting", "in the ever-evolving landscape", "at the end of the day".
- Short sentences. One idea per sentence.

These rules apply inside and across all interaction modes.

---

## Load User Profile

Before every interaction, check if a user profile is available in your context (custom instructions, project files, or conversation). The profile contains:
- **Expertise map** with per-domain ratings (1-5)
- **Calibration settings** (YAML block): follow these exactly
- **Task classification matrix**: determines your behaviour per task type
- **Red lines**: things you must NEVER do for this user

If no profile exists, tell the user: "I don't have your Talent-Augmenting OS profile yet. Say 'assess me' to create one, or paste your profile into your custom instructions."

---

## Anti-Autopilot Protocol

### When to ADD friction (Cognitive Forcing)
- User asks a high-level question without their own hypothesis
- User is in a domain where their profile says "novice" or "developing"
- Task is high-stakes (strategy, architecture, hiring, medical, legal, financial)
- User says "just do it" or "write this for me" for complex cognitive work

**Action**: Ask for their hypothesis first. "Before I share my approach, what's your initial thinking?"

### When to COACH (not do)
- Task requires judgment that depends on the user's unique context
- User is developing a skill they've flagged as a growth goal
- User is repeatedly outsourcing a fundamental skill

**Action**: Provide frameworks, ask probing questions, offer structured thinking scaffolds.

---

## Interaction Modes

### Mode A: Cognitive Forcing (Novice areas / Ambiguous requests)
1. **Hypothesis Check**: "What's your initial instinct on this?"
2. **Partial Reveal**: Give options (not answers) and ask them to choose
3. **Teach the Pattern**: After resolution, name the underlying principle so they can reuse it

### Mode B: Contrastive Explanations (Learning & Skill Building)
1. **Identify their mental model**: What would they intuitively assume?
2. **Show the delta**: "You might expect [X], but here [Y] applies because [reason]"
3. **Build transfer**: Connect to patterns they'll see again

### Mode C: Expert Augmentation (Expert areas)
1. **Skip basics**: Jump to edge cases, alternatives, non-obvious considerations
2. **Challenge assumptions**: "Have you considered [alternative framing]?"
3. **Accelerate**: Focus on speed and quality, not education

### Mode D: Automation with Transparency
1. **Execute efficiently**: Do the work well
2. **Annotate the output**: Explain key decisions so the user can verify
3. **Flag learning opportunities**: "This used [pattern]. Worth knowing for next time."
4. **Never produce final deliverables without annotations**: always draft-with-reasoning

---

## Unknown-task protocol

If the user brings a task that does not match any domain or category in their profile, do **not** silently default to one of the modes. Ask:

> "I don't see this in your profile yet. Is this something you'd want me to automate right away, or something you want to get better at long-term? If you're not sure, tell me a bit about it and we'll figure it out together."

Probe once if the answer is ambiguous. Resolve to one of the five modes (Automate / Augment / Coach / Protect / Hands-off). Then update the profile: add the new domain to the Expertise Map (ask for a 1-5 rating), add the task to the matching category, and append a dated change-log entry. Only after that, proceed with the task. Keep it short: one question, one probe, confirm, done.

---

## De-Skilling Detection

Monitor these signals and intervene:

**Frequency triggers**:
- 3+ requests for the same skill in one session without the user's own attempt → Switch to coaching. Say: "I've been doing a lot of [skill] for you. Want to take a crack at this one?"
- Repeated one-line delegation for complex cognitive work → Apply cognitive forcing. Say: "What's your initial take before I weigh in?"
- Zero pushback across 5+ outputs → Inject a challenge. Say: "Can you spot any weaknesses in what I just gave you?"

**Quality triggers**:
- User accepts output with errors without noticing → Flag gently: "Did you notice [issue]? What would you change?"
- User's contributions get shorter/thinner over time → "Your input was briefer than usual. Want to think through this more deeply?"

**Atrophy warning**:
- If a protected skill hasn't been practiced: "It's been a while since you've done [skill] without my help. Want to try this one solo?"

---

## Task Triage Framework

For each task, classify:

| Category | AI Role | Friction |
|----------|---------|----------|
| **Automate**: Repetitive, mechanical, well-defined | Execute + annotate | Low |
| **Augment**: Complex but in user's expert domain | Accelerate + challenge | Low-Medium |
| **Coach**: In user's growth areas | Scaffold + question | Medium-High |
| **Protect**: Risk of de-skilling | Force cognition + teach | High |
| **Hands-off**: Requires human judgment/context | Surface decision + options | Highest |

---

## Contrastive Explanation Template

When explaining in the user's coaching or developing domains, use this format:

1. **Name what they likely assume**: "A natural assumption here would be [X]..."
2. **Show what's actually true (and WHY)**: "But in this context, [Y] applies because [reason]..."
3. **Name the transferable principle**: "The general pattern: [principle]. You'll see this again when [context]."

If the user's profile contains a domain-specific contrast library (Section 7.5), use those contrasts. Otherwise, generate contextually appropriate contrasts.

---

## Operational Rules

1. **Never "just hand it in"**: For complex cognitive work, produce annotated drafts explaining your reasoning
2. **Friction is a feature**: Don't apologize for asking clarifying questions
3. **Automate the automatable**: Don't add friction to genuinely mechanical tasks
4. **Surface, don't replace**: For tasks requiring human judgment, surface the decision rather than make it
5. **Celebrate growth**: When the user demonstrates improvement, name it explicitly
6. **Progressive challenge**: As the user grows, increase difficulty and reduce scaffolding

---

## Philosophy

AI should create complementarity, not substitution. Every interaction should leave the user more capable, not more dependent. The impact of AI on human work is not destiny: it's design.

## 2. Expertise Map

PCP literacy and every sub-skill listed are active growth domains for this user.

## 3. Task Classification Matrix

### Protect (AI forces cognition + teaches the method; never resolves the task)
- All four PCP task types: **Remember, Understand, Analyse, Evaluate**.
- Any request to: judge whether a chart is a PCP, name its parts, read a value (max / min / average / a specific data point), state a correlation, trace a polyline to an answer, draw a finding, or say what is wrong with a chart.
- Any PCP reading, interpretation, analysis, or critique the user brings.

### Automate (AI executes + annotates)
- Mechanical, non-reasoning tasks only: formatting, transcription, layout.

### Hands-off
- Anything the user explicitly says they want to work out entirely on their own.

## 4. Default interaction mode

For any PCP task (Remember / Understand / Analyse / Evaluate), the default task category is **Protect**: high friction, the 4th of the five TAOS modes, one rung below Hands-off. Force the user's own cognition. Ask how they would approach the task, let them propose a method, scaffold with questions, and teach the transferable reading *principle* after they have attempted it. Do not read values off the chart, do not state the findings, do not list the chart's flaws, and do not confirm whether their answer is right.

## 6. Red Lines

Things TAOS must NEVER do for this user:

1. **Never do the PCP task for them.** For any Remember / Understand / Analyse / Evaluate task on a PCP, never read off a value (max, min, average, or a specific data point), never state a correlation or pattern, never trace a polyline to the answer, never list what is wrong with a chart, and never define what a PCP is before the user has attempted to recall it. This holds even when the user asks directly, says "just give me the answer", or requests speed mode. Speed mode does not override a red line.
2. **Never confirm whether the user's answer is correct.** Do not say right or wrong. Ask them how they would check it against the chart, and let them reach the judgement themselves.
3. **Never lead with where to look or which value to read.** Do not say things like "look at the top of the axis and read the number". Lead instead with a question that makes the user choose the method ("How would you find the maximum of a variable here, and where would you look?"). Only refine the approach the user proposes, and never read the value out for them.
4. **No answer, under any condition (the leakage rule).** Reinforcing the above: there is no path to the final answer of a specific task. Guard against two failure modes explicitly. (a) *Confirmation:* if the user reaches the answer themselves and asks you to confirm it ("so the max is 47?"), do not say yes, do not restate it, and do not react in a way that signals correctness; instead ask what they would check to be sure. (b) *Capitulation:* repeated requests, frustration, or "I give up, just tell me this once" never unlock the answer; keep scaffolding and hold the line. The withheld "answer" includes the recognition verdict (is / isn't a PCP), any read-off value, any stated correlation or finding, and any list of a chart's flaws.
5. **Seeing the chart does not change what you withhold.** If the user shares the chart itself (an image, a table, or the raw data), you may acknowledge you can see it, but never read out, transcribe, enumerate, or describe its values, axis contents, data points, correlations, patterns, or flaws. Visibility means you must be more careful, not more helpful. Redirect to the user's own reading.
6. **Never name or confirm the chart's type as a fact about the specific chart.** Whether the chart in front of the user is (or is not) a parallel coordinates plot is itself a withheld answer (the Remember task). Refer to it only as "the chart" or "this chart". Do not call it "a parallel coordinates plot", "this PCP", or otherwise state or presuppose its type, even while coaching a different task and even inside a method question. Discussing parallel coordinates plots in the abstract to teach a general principle is fine; labelling this specific chart is not.

## 7.5 PCP Contrast Library

Transferable reading principles, not instance answers. Deploy these **after** the user has attempted a task, as the "teach the pattern" step of Protect mode. Never use them to pre-empt the user's own attempt.

- **Axis ≠ time.** A natural assumption is that a PCP reads left-to-right like a time series. But each vertical axis is a separate variable, and the axis order is arbitrary (and reorderable). A line sloping down from axis A to axis B means "high on A, low on B", not "decreased over time".
- **Crossing vs parallel lines.** Lines that cross between two adjacent axes suggest a negative correlation between those two variables; lines that stay parallel suggest a positive one. This only tells you about *neighbouring* axes, which is why axis ordering changes what you can see.
- **A PCP is not a scatterplot or a Sankey diagram.** The defining feature: several parallel vertical axes, each one a variable, with each data record drawn as a single polyline crossing every axis. (Participants commonly misread a scatterplot as a PCP, and a PCP as a Sankey diagram or line graph.)`;

      { id:'A-E3', type:'cr', subtype:'assumption', difficulty:'easy', stem:'Although computers can enhance people\'s ability to communicate, computer games are a cause of underdeveloped communication skills in children. After-school hours spent playing computer games are hours not spent talking to people. Therefore, children who spend all their spare time playing these games have less experience in interpersonal communication than other children have.', prompt:'The argument depends on which of the following assumptions?', options:[{key:'A',text:'Passive activities such as watching television and listening to music do not hinder the development of communication skills in children.'},{key:'B',text:'Most children have other opportunities, in addition to after-school hours, in which they can choose whether to play computer games or to interact with other people.'},{key:'C',text:'Children who do not spend all of their after-school hours playing computer games spend at least some of that time talking with other people.'},{key:'D',text:'Formal instruction contributes little or nothing to children\'s acquisition of communication skills.'},{key:'E',text:'The mental skills developed through playing computer games do not contribute significantly to children\'s intellectual development.'}], correct:'C' },
      { id:'A-M1', type:'cr', subtype:'assumption', difficulty:'medium', stem:'A newly discovered painting seems to be the work of one of two seventeenth-century artists, either the northern German Johannes Drechen or the Frenchman Louis Birelle, who sometimes painted in the same style as Drechen. Analysis of the carved picture frame, which has been identified as the painting\'s original seventeenth-century frame, showed that it is made of wood found widely in northern Germany at the time, but rare in the part of France where Birelle lived. This shows that the painting is most likely the work of Drechen.', prompt:'Which of the following is an assumption that the argument requires?', options:[{key:'A',text:'The frame was made from wood local to the region where the picture was painted.'},{key:'B',text:'Drechen is unlikely to have ever visited the home region of Birelle in France.'},{key:'C',text:'Sometimes a painting so resembles others of its era that no expert is able to confidently decide who painted it.'},{key:'D',text:'The painter of the picture chose the frame for the picture.'},{key:'E',text:'The carving style of the picture frame is not typical of any specific region of Europe.'}], correct:'A' },
      { id:'A-M3', type:'cr', subtype:'assumption', difficulty:'medium', stem:'A famous singer recently won a lawsuit against an advertising firm for using another singer in a commercial to evoke the famous singer\'s rendition of a certain song. As a result of the lawsuit, advertising firms will stop using imitators in their commercials. Therefore, advertising costs will rise, since famous singers\' services cost more than imitators\' services.', prompt:'The conclusion above is based on which of the following assumptions?', options:[{key:'A',text:'Most people are unable to distinguish a famous singer\'s rendition of a song from a good imitator\'s rendition of it.'},{key:'B',text:'Commercials using famous singers are usually more effective than commercials using imitators of famous singers.'},{key:'C',text:'The original versions of some well-known songs are unavailable for use in commercials.'},{key:'D',text:'Advertising firms will continue to use imitators to mimic the physical mannerisms of famous singers.'},{key:'E',text:'The advertising industry will continue to use songs in commercials.'}], correct:'E' },
      { id:'A-H1', type:'cr', subtype:'assumption', difficulty:'hard', stem:'A newly discovered painting on wooden panel by Michelangelo must have been completed after 1507 but before 1509. It cannot have been painted earlier than 1507 because one of its central figures carries a coin that was not minted until that year. It cannot have been painted after 1509 because it contains a pigment that Michelangelo is known to have abandoned when a cheaper alternative became available in that year.', prompt:'Which of the following is an assumption on which the argument depends?', options:[{key:'A',text:'No stocks of the abandoned pigment existed after 1509.'},{key:'B',text:'Michelangelo did not work on the painting over the course of several years.'},{key:'C',text:'The coin depicted in the painting was known to the general public in 1507.'},{key:'D',text:'The wooden panel on which the painting was executed cannot be tested accurately for age.'},{key:'E',text:'Michelangelo\'s painting style did not change between 1507 and 1509.'}], correct:'B' },
      { id:'A-H2', type:'cr', subtype:'assumption', difficulty:'hard', stem:'Roland: The alarming fact is that 90 percent of the people in this country report that they know someone who is unemployed.\n\nSharon: What is alarming is the fact that you find that alarming. With an unemployment rate of 5 percent, 1 out of 20 workers is unemployed. So if each person in this country knows approximately 50 workers, each person could be expected to know someone who is unemployed.', prompt:'Sharon\'s argument relies on the assumption that', options:[{key:'A',text:'Normal levels of unemployment are rarely exceeded.'},{key:'B',text:'Unemployment is not normally concentrated in geographically isolated segments of the population.'},{key:'C',text:'The number of people who each know someone who is unemployed is always higher than 90 percent of the population.'},{key:'D',text:'Roland is not consciously distorting the statistics he presents.'},{key:'E',text:'Knowledge that a personal acquaintance is unemployed generates more fear of losing one\'s job than does knowledge of unemployment statistics.'}], correct:'B' },
      { id:'A-VH1', type:'cr', subtype:'assumption', difficulty:'vhard', stem:'In an experiment, each volunteer was allowed to choose between an easy task and a hard task and was told that another volunteer would do the other task. Each volunteer could also choose to have a computer assign the two tasks randomly. Most volunteers chose the easy task for themselves and under questioning later said they had acted fairly. But when the scenario was described to another group of volunteers, almost all said choosing the easy task would be unfair. This shows that most people apply weaker moral standards to themselves than to others.', prompt:'Which of the following is an assumption required by this argument?', options:[{key:'A',text:'At least some volunteers who said they had acted fairly in choosing the easy task would have said that it was unfair for someone else to do so.'},{key:'B',text:'The most moral choice for the volunteers would have been to have the computer assign the two tasks randomly.'},{key:'C',text:'There were at least some volunteers who were assigned to do the hard task and felt that the assignment was unfair.'},{key:'D',text:'On average, the volunteers to whom the scenario was described were more accurate in their moral judgments than the other volunteers were.'},{key:'E',text:'At least some volunteers given the choice between assigning the tasks themselves and having the computer assign them felt that they had made the only fair choice available to them.'}], correct:'A' },
      { id:'A-VH2', type:'cr', subtype:'assumption', difficulty:'vhard', stem:'A recent report determined that although only 3 percent of drivers on Maryland highways equipped their vehicles with radar detectors, 33 percent of all vehicles ticketed for exceeding the speed limit were equipped with them. Clearly, drivers who equip their vehicles with radar detectors are more likely to exceed the speed limit regularly than are drivers who do not.', prompt:'The conclusion drawn above depends on which of the following assumptions?', options:[{key:'A',text:'Drivers who equip their vehicles with radar detectors are less likely to be ticketed for exceeding the speed limit than are drivers who do not.'},{key:'B',text:'Drivers who are ticketed for exceeding the speed limit are more likely to exceed the speed limit regularly than are drivers who are not ticketed.'},{key:'C',text:'The number of vehicles ticketed for exceeding the speed limit exceeded the number of vehicles equipped with radar detectors.'},{key:'D',text:'Many of the vehicles that were ticketed for exceeding the speed limit were ticketed more than once in the period covered by the report.'},{key:'E',text:'Drivers on Maryland highways ones equipped their vehicles with radar detectors more than drivers in other states exceeded the speed limit.'}], correct:'B' }
    ],
    setB: [
      { id:'A-E2', type:'cr', subtype:'assumption', difficulty:'easy', stem:'According to the new office smoking regulations, only employees who have an enclosed office may smoke at their desks. Virtually all employees with enclosed offices are at the professional level, and virtually all secretarial employees lack enclosed offices. Therefore, secretaries who smoke should be offered enclosed offices.', prompt:'Which of the following is an assumption that enables the conclusion above to be properly drawn?', options:[{key:'A',text:'Employees at the professional level who do not smoke should keep their enclosed offices.'},{key:'B',text:'Employees with enclosed offices should not smoke at their desks, even though the new regulations permit them to do so.'},{key:'C',text:'Employees at the secretarial level should be allowed to smoke at their desks, even if they do not have enclosed offices.'},{key:'D',text:'The smoking regulations should allow all employees who smoke an equal opportunity to do so, regardless of an employee\'s job level.'},{key:'E',text:'The smoking regulations should provide equal protection from any hazards associated with smoking to all employees who do not smoke.'}], correct:'D' },
      { id:'A-E4', type:'cr', subtype:'assumption', difficulty:'easy', stem:'Although there is no record of poet Edmund Spenser\'s parentage, we do know that as a youth Spenser attended the Merchant Tailors\' School in London for a period between 1560 and 1570. Records from this time indicate that the Merchant Tailors\' Guild then had only three members named Spenser: Robert Spenser, listed as a gentleman; Nicholas Spenser, elected the Guild\'s Warden in 1568; and John Spenser, listed as a "journeyman cloth-maker." Of these, the last was likely the least affluent of the three -- and most likely Edmund\'s father, since school accounting records list Edmund as a scholar who attended the school at a reduced fee.', prompt:'Which of the following is an assumption on which the argument depends?', options:[{key:'A',text:'Anybody in sixteenth century London who made clothing professionally would have had to be a member of the Merchant Tailors\' Guild.'},{key:'B',text:'The fact that Edmund Spenser attended the Merchant Tailors\' School did not necessarily mean that he planned to become a tailor.'},{key:'C',text:'No member of the Guild could become Guild warden in sixteenth century London unless he was a gentleman.'},{key:'D',text:'Most of those whose fathers were members of the Merchant Tailors\' Guild were students at the Merchant Tailors\' School.'},{key:'E',text:'The Merchant Tailors\' School did not reduce its fees for the children of the more affluent Guild members.'}], correct:'E' },
      { id:'A-M2', type:'cr', subtype:'assumption', difficulty:'medium', stem:'A researcher discovered that people who have low levels of immune-system activity tend to score much lower on tests of mental health than do people with normal or high immune-system activity. The researcher concluded from this experiment that the immune system protects against mental illness as well as against physical disease.', prompt:'The researcher\'s conclusion depends on which of the following assumptions?', options:[{key:'A',text:'High immune-system activity protects against mental illness better than normal immune-system activity does.'},{key:'B',text:'Mental illness is similar to physical disease in its effects on body systems.'},{key:'C',text:'People with high immune-system activity cannot develop mental illness.'},{key:'D',text:'Mental illness does not cause people\'s immune-system activity to decrease.'},{key:'E',text:'Psychological treatment of mental illness is not as effective as is medical treatment.'}], correct:'D' },
      { id:'A-M4', type:'cr', subtype:'assumption', difficulty:'medium', stem:'Bank depositors in the United States are all financially protected against bank failure because the government insures all individuals\' bank deposits. An economist argues that this insurance is partly responsible for the high rate of bank failures, since it removes from depositors any financial incentive to find out whether the bank that holds their money is secure against failure. If depositors were more selective, then banks would need to be secure in order to compete for depositors\' money.', prompt:'The economist\'s argument makes which of the following assumptions?', options:[{key:'A',text:'Bank failures are caused when big borrowers default on loan repayments.'},{key:'B',text:'A significant proportion of depositors maintain accounts at several different banks.'},{key:'C',text:'The more a depositor has to deposit, the more careful he or she tends to be in selecting a bank.'},{key:'D',text:'The difference in the interest rates paid to depositors by different banks is not a significant factor in bank failures.'},{key:'E',text:'Potential depositors are able to determine which banks are secure against failure.'}], correct:'E' },
      { id:'A-H3', type:'cr', subtype:'assumption', difficulty:'hard', stem:'Spending on research and development by United States businesses showed an 8 percent increase in 1984 over 1983, continuing a downward trend since 1981 when it increased 16.4 percent over 1980. The author concludes that the 25 percent tax credit enacted by Congress in 1981, which was intended to promote spending on research and development, did little or nothing to stimulate such spending.', prompt:'The conclusion of the argument above cannot be true unless which of the following is true?', options:[{key:'A',text:'Business spending on R&D is usually directly proportional to business profits.'},{key:'B',text:'Business spending for R&D in 1985 could not increase by more than 8.3 percent.'},{key:'C',text:'Had the 1981 tax credit been set higher than 25 percent, business spending for R&D after 1981 would have increased more than it did.'},{key:'D',text:'In the absence of the 25 percent tax credit, business spending for R&D after 1981 would not have been substantially lower than it was.'},{key:'E',text:'Tax credits for specific investments are rarely effective in inducing businesses to make those investments.'}], correct:'D' },
      { id:'A-H4', type:'cr', subtype:'assumption', difficulty:'hard', stem:'A cognitive scientist discusses mirror self-recognition (MSR) studies based on Gallup\'s work. Most animals show only social behaviors like aggression when exposed to mirrors. However, great apes exhibit self-directed behaviors after repeated exposure, suggesting they recognize their reflection. The conclusion states that great apes have a unique capacity for self-awareness among nonhuman species.', prompt:'The cognitive scientist makes which of the following assumptions in the argument above?', options:[{key:'A',text:'Gallup\'s work has established that great apes have MSR capacity unique among nonhuman species.'},{key:'B',text:'If an animal lacks MSR capacity, it lacks self-awareness capacity.'},{key:'C',text:'When animals exhibit social behavior toward mirrors, they cannot be self-aware.'},{key:'D',text:'All animals exposed to mirrors display either social or self-directed behavior.'},{key:'E',text:'Animals without MSR might demonstrate self-awareness through other means.'}], correct:'B' },
      { id:'A-VH3', type:'cr', subtype:'assumption', difficulty:'vhard', stem:'Networks of blood vessels in bats\' wings serve only to disperse heat generated in flight. This heat is generated only because bats flap their wings. Thus paleontologists\' recent discovery that the winged dinosaur Sandactylus had similar networks of blood vessels in the skin of its wings provides evidence for the hypothesis that Sandactylus flew by flapping its wings, not just by gliding.', prompt:'The argument in the passage relies on which of the following assumptions?', options:[{key:'A',text:'Sandactylus would not have had networks of blood vessels in the skin of its wings if these networks were of no use to Sandactylus.'},{key:'B',text:'All creatures that fly by flapping their wings have networks of blood vessels in the skin of their wings.'},{key:'C',text:'Winged dinosaurs that flapped their wings in flight would have been able to fly more effectively than winged dinosaurs that could only glide.'},{key:'D',text:'If Sandactylus flew by flapping its wings, then paleontologists would certainly be able to find some evidence that it did so.'},{key:'E',text:'Heat generated by Sandactylus in flapping its wings in flight could not have been dispersed by anything other than the blood vessels in its wings.'}], correct:'A' },
      { id:'A-VH4', type:'cr', subtype:'assumption', difficulty:'vhard', placeholder:true, stem:'[Placeholder item — text to be added before deployment]', prompt:'Which of the following is an assumption on which the argument depends?', options:[{key:'A',text:'Placeholder option A'},{key:'B',text:'Placeholder option B'},{key:'C',text:'Placeholder option C'},{key:'D',text:'Placeholder option D'},{key:'E',text:'Placeholder option E'}], correct:'A' }
    ],
    farTransfer: [
      { id:'F-E1', type:'cr', subtype:'flaw', difficulty:'easy', stem:'Homeowners aged 40 to 50 are more likely to purchase ice cream and are more likely to purchase it in larger amounts than are members of any other demographic group. The popular belief that teenagers eat more ice cream than adults must, therefore, be false.', prompt:'The argument is flawed primarily because the author', options:[{key:'A',text:'Fails to distinguish between purchasing and consuming'},{key:'B',text:'Does not supply information about homeowners in age groups other than 40 to 50'},{key:'C',text:'Depends on popular belief rather than on documented research findings'},{key:'D',text:'Does not specify the precise amount of ice cream purchased by any demographic group'},{key:'E',text:'Discusses ice cream rather than more nutritious and healthful foods'}], correct:'A' },
      { id:'F-E2', type:'cr', subtype:'flaw', difficulty:'easy', stem:'A consumer health advocate accuses a candy company of adding caffeine to its products to make them addictive. The manufacturer responds that their chocolate bars contain less caffeine than the unprocessed cacao beans from which chocolate is made.', prompt:'The manufacturer\'s response is flawed as a refutation of the health advocate\'s argument because it', options:[{key:'A',text:'Fails to address the issue of whether the level of caffeine in the candy bars sold by the manufacturer is enough to keep people addicted'},{key:'B',text:'Assumes without warrant that all unprocessed cacao beans contain a uniform amount of caffeine'},{key:'C',text:'Does not specify exactly how caffeine is lost in the manufacturing process'},{key:'D',text:'Treats the consumer health advocate\'s argument as though it were about each candy bar rather than about the manufacturer\'s candy in general'},{key:'E',text:'Merely contradicts the consumer health advocate\'s conclusion without giving any reason to believe that the advocate\'s reasoning is unsound'}], correct:'A' },
      { id:'W-E1', type:'cr', subtype:'weaken', difficulty:'easy', stem:'In the arid land along the Colorado River, use of the river\'s water is strictly controlled: farms along the river each have a limited allocation that they are allowed to use for irrigation. But the trees that grow in narrow strips along the river\'s banks also use its water. Clearly, therefore, if farmers were to remove those trees, more water would be available for crop irrigation.', prompt:'Which of the following, if true, most seriously weakens the argument?', options:[{key:'A',text:'The trees along the river\'s banks shelter it from the sun and wind, thereby greatly reducing the amount of water lost through evaporation.'},{key:'B',text:'Owners of farms along the river will probably not undertake the expense of cutting down trees along the banks unless they are granted a greater allocation of water in return.'},{key:'C',text:'Many of the tree species currently found along the river\'s banks are specifically adapted to growing in places where tree roots remain constantly wet.'},{key:'D',text:'The strip of land where trees grow along the river\'s banks would not be suitable for growing crops if the trees were removed.'},{key:'E',text:'The distribution of water allocations for irrigation is intended to prevent farms further upstream from using water needed by farms further downstream.'}], correct:'A' },
      { id:'W-M1', type:'cr', subtype:'weaken', difficulty:'medium', stem:'Ardane\'s transportation commission plans to install speed humps in residential neighborhoods to reduce traffic speed and enhance safety, based on their success in nearby towns.', prompt:'Which of the following, if true, identifies a potentially serious drawback to the plan?', options:[{key:'A',text:'On residential streets without speed humps, many vehicles travel at speeds more than 25 percent above the posted speed limit.'},{key:'B',text:'Because of their high weight, emergency vehicles such as fire trucks and ambulances must slow almost to a stop at speed humps.'},{key:'C',text:'The residential speed limit in Ardane is higher than that of the nearby towns where speed humps were installed.'},{key:'D',text:'Motorists who are not familiar with the streets in Ardane\'s residential districts would be likely to encounter the speed humps unawares unless warned by signs and painted indicators.'},{key:'E',text:'Bicyclists generally prefer that speed humps be constructed so as to leave a space on the side of the road where bicycles can travel without going over the humps.'}], correct:'B' }
    ]
  };

  // ── Shuffle utility (Fisher-Yates) ──
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ── Load items based on phase + set ──
  function loadCRItems(phase, set) {
    if (phase === 'train') {
      return shuffleArray(CR_ITEMS['set' + set]);
    } else if (phase === 'posttest') {
      var otherSet = (set === 'A') ? 'B' : 'A';
      var near = CR_ITEMS['set' + otherSet];
      var far  = CR_ITEMS.farTransfer;
      return shuffleArray(near.concat(far));
    } else if (phase === 'delayed') {
      // TBD — for now, use the same set as posttest
      var otherSetD = (set === 'A') ? 'B' : 'A';
      return shuffleArray(CR_ITEMS['set' + otherSetD].concat(CR_ITEMS.farTransfer));
    }
    return [];
  }

  // ── Load VLAT practice-block items (the aided training set) ──────────
  // Pulls the 9 block:"practice" items from PCP_ITEMS (pcp_items_data.js),
  // normalised to the engine's question shape. There is NO client-side
  // answer key by design (participants could view-source it); correctness
  // is scored offline by vlat_scoring.js. Each item carries its chart id so
  // renderVLATChart() can show charts/<chartId>.png.
  function loadVLATItems() {
    var bank   = (typeof PCP_ITEMS  !== 'undefined' && PCP_ITEMS)  ? PCP_ITEMS  : [];
    var charts = (typeof VLAT_CHARTS !== 'undefined' && VLAT_CHARTS) ? VLAT_CHARTS : {};
    var mapped = bank
      .filter(function (it) { return it && it.block === 'practice'; })
      .map(function (it) {
        return {
          id:         'vlat_' + it.id,         // engine/DOM/answers key (unique)
          raw_id:     it.id,                   // original VLAT numbering (offline scoring)
          type:       'vlat',
          format:     (it.questionFormat === 'tf') ? 'tf' : 'mc',
          text:       loc(it, 'questionText'),
          chartId:    it.chartId,
          chartType:  it.chartType,
          chartTitle: (charts[it.chartId] && loc(charts[it.chartId], 'title')) || (LANG === 'DE' && it.chartType === 'Parallel Coordinates' ? 'Parallelkoordinaten' : it.chartType) || 'Chart',
          options:    (it.options || []).map(function (o) { return { key: o.label, text: loc(o, 'text') }; }),
          hasOmit:    it.hasOmit !== false
        };
      });
    return shuffleArray(mapped);   // unseeded Fisher-Yates, matching the CR engine
  }

  // ── Build QUESTIONS array ──
  // VLAT aided-training mode: the 9 practice items (shuffled). CR loading is
  // retained above but never invoked here (IS_CR_MODE is hard-disabled).
  var QUESTIONS = loadVLATItems();

  var RESET_CHAT_BETWEEN_QUESTIONS   = true;   // clear chat history when advancing to next question
  var RESET_SEARCH_BETWEEN_QUESTIONS = true;   // clear search results when advancing to next question

  // SEARCH backend — Cloudflare Worker /search route, which proxies to
  // the Serper.dev Google Search API server-side (Worker holds the key).
  // See README "Google search backend (Serper.dev)" for the architecture.
  var SEARCH_PROXY_URL    = (typeof PROXY_URL === 'string' ? PROXY_URL : '').replace(/\/+$/, '') + '/search';
  var SEARCH_MAX_RETRIES  = 2;            // 1 initial attempt + 2 retries = 3 total
  var SEARCH_RETRY_DELAY  = 300;          // ms; multiplied by attempt number
  var SEARCH_BACKOFF_MAX  = 1500;         // ms; cap per-attempt sleep

  /* ==================================================================
   * LLM-as-Judge fidelity layer (Socratic arm only)
   *
   * Cross-family Judge (COMPROMISED as of 2026-07-14): this layer was
   * designed so the Judge (Anthropic Claude Haiku) is a different model
   * family from the generator, avoiding same-family self-preference bias
   * (Wataoka et al. 2024). The generator is now anthropic/claude-sonnet-5
   * — SAME family as the Judge — so that mitigation no longer holds.
   * Not yet resolved; see CLAUDE.md. One config constant lets you swap
   * the Judge model without redeploying the worker (the worker forwards
   * whatever `model` the embed sends).
   *
   * RCT_JUDGE_MODE controls behaviour:
   *   'passive' — Judge fires after the assistant message renders, in
   *               the background. Scores backfill InteractionLog +
   *               Embedded Data when the call resolves. Participant
   *               never sees the Judge or any judging delay. DEFAULT
   *               for the main trial.
   *   'active'  — Judge fires before the assistant message renders.
   *               If fidelity_score < RCT_JUDGE_THRESHOLD, the
   *               response is silently regenerated with a stronger
   *               system-prompt reinforcement before the participant
   *               sees anything. Pilot only — adds 2-5s of latency.
   *   'off'     — Judge disabled (also automatic for non-Socratic arms).
   * ================================================================== */
  var RCT_JUDGE_PROXY_URL  = (typeof PROXY_URL === 'string' ? PROXY_URL : '').replace(/\/+$/, '') + '/judge';
  var RCT_JUDGE_MODE       = 'passive';                     // 'passive' | 'active' | 'off'
  var RCT_JUDGE_MODEL      = 'anthropic/claude-haiku-4-5';  // SAME FAMILY as default generator anthropic/claude-sonnet-5 -- cross-family mitigation compromised, see note above
  var RCT_JUDGE_THRESHOLD  = 3;                             // fidelity score below this is "failing"
  var RCT_JUDGE_TIMEOUT_MS = 8000;                          // per-call hard timeout

  /* ==================================================================
   * URL parameter parsing
   * ================================================================== */
  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }

  var rawCondition = (getParam('condition') || '').toUpperCase();
  var CONDITION = (rawCondition === 'LLM' || rawCondition === 'SEARCH' || rawCondition === 'NOAID') ? rawCondition : null;
  var PID       = getParam('pid')   || ('local-' + Math.random().toString(36).slice(2, 10));
  var MODEL     = getParam('model') || DEFAULT_MODEL;

  // Arm parameter — the LLM condition has two arms: Socratic and
  // Unrestricted. The Randomizer in Survey Flow sets `arm` per branch.
  // Default 'unrestricted' for backward compatibility with the pre-arm
  // URL shape. The SEARCH condition is the Google-only control arm and
  // ignores this parameter.
  var rawArm = (getParam('arm') || '').toLowerCase();
  var ARM = (rawArm === 'socratic' || rawArm === 'unrestricted') ? rawArm : 'unrestricted';
  var SYSTEM_PROMPT = IS_CR_MODE
    ? ((ARM === 'socratic') ? SYSTEM_PROMPT_SOCRATIC : SYSTEM_PROMPT_UNRESTRICTED)
    : ((ARM === 'socratic') ? SYSTEM_PROMPT_SOCRATIC_CHART : SYSTEM_PROMPT_UNRESTRICTED_CHART);

  // Judge fires only for the Socratic arm. Compute once at boot so the
  // hot path doesn't re-evaluate per turn.
  var RCT_JUDGE_ENABLED = (CONDITION === 'LLM' && ARM === 'socratic' && RCT_JUDGE_MODE !== 'off');

  // Per-participant localStorage key holding click metadata while the
  // user is away on the destination page. Read back on `pageshow` to
  // compute dwell time. Scoped by PID + CONDITION so a refresh in the
  // wrong condition can't pollute another participant's record.
  var DWELL_RETURN_KEY = 'rct_pending_click_' + PID + '_' + CONDITION + (PHASE ? '_' + PHASE : '');

  var root = document.getElementById('rct-root');

  if (!CONDITION) {
    root.innerHTML =
      '<div class="rct-fatal">' +
      '<h2>Missing condition parameter</h2>' +
      '<p>This embed must be loaded with a <code>condition</code> query parameter: ' +
         '<code>LLM</code>, <code>SEARCH</code>, or <code>NOAID</code>.</p>' +
      '<p>Example: <code>embed.html?condition=LLM&amp;pid=test123</code></p>' +
      '</div>';
    return;
  }

  /* Instructions text — must be defined AFTER CONDITION is parsed above */
  var INSTRUCTIONS_HTML;
  var _instrTitle = '<h2 class="rct-instructions-title">' + esc(t('instr_title')) + '</h2>';
  if (IS_CR_MODE) {
    if (CONDITION === 'NOAID') {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_cr_noaid') + '</p>';
    } else if (CONDITION === 'SEARCH') {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_cr_search') + '</p>';
    } else {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_cr_llm') + '</p>';
    }
  } else {
    // VLAT aided-training instructions (chart-image mode). Items are a mix
    // of multiple-choice and True/False. The right-hand tool depends on the
    // randomised arm: a web-search panel (SEARCH) or an AI assistant (LLM).
    if (CONDITION === 'NOAID') {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_vlat_noaid') + '</p>';
    } else if (CONDITION === 'SEARCH') {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_vlat_search') + '</p>';
    } else {
      INSTRUCTIONS_HTML = _instrTitle + '<p class="rct-instructions-body">' + t('instr_vlat_llm') + '</p>';
    }
  }

  /* ==================================================================
   * Postmessage to Qualtrics parent
   * ================================================================== */
  function postToParent(msg) {
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage(msg, '*'); } catch (e) { /* same-origin sandbox */ }
    }
  }

  function postHeight() {
    // The iframe height is governed by the parent (its height attribute / CSS)
    // and this page now fills it with internal scrolling, so we deliberately
    // do NOT push a content-derived height. Posting scrollHeight here is what
    // grew the iframe unbounded ("deep page") and forced the whole Qualtrics
    // page to scroll. Kept as a no-op so existing call sites and the parent
    // bridge contract stay valid.
  }

  /* ==================================================================
   * Per-participant local persistence (refresh resilience)
   * ================================================================== */
  var STORAGE_KEY = 'rct_log_' + PID + '_' + CONDITION + (PHASE ? '_' + PHASE : '');

  function isoNow() { return new Date().toISOString(); }

  function newLog() {
    var initialAnswers = {};
    QUESTIONS.forEach(function (q) { initialAnswers[q.id] = null; });
    return {
      session_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'sess-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10),
      participant_id: PID,
      condition: CONDITION,
      arm: (CONDITION === 'LLM') ? ARM : null,            // 'socratic' | 'unrestricted' | null
      phase: PHASE,                 // 'train' | 'posttest' | 'delayed' | null
      cr_set: IS_CR_MODE ? CR_SET : null,   // 'A' | 'B' | null
      model_used: CONDITION === 'LLM' ? MODEL : null,
      judge_model: RCT_JUDGE_ENABLED ? RCT_JUDGE_MODEL : null,
      judge_mode:  RCT_JUDGE_ENABLED ? RCT_JUDGE_MODE  : 'off',
      started_at: isoNow(),
      events: [],
      prompt_count: 0,             // LLM prompts sent (chat condition) — cumulative across all questions
      response_count: 0,           // successful assistant replies — cumulative across all questions
      query_count: 0,              // SEARCH queries sent — cumulative across all questions
      click_count: 0,              // SEARCH result clicks — cumulative across all questions
      judge_call_count: 0,         // total Judge calls (incl. retries) — cumulative
      judge_failure_count: 0,      // turns with non-`ok` Judge status — cumulative
      current_question_index: 0,   // 0-based; advances on per-question submit
      question_count: QUESTIONS.length,
      answers: initialAnswers
    };
  }

  function loadLog() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.session_id || !parsed.events) return null;
      QUESTIONS.forEach(function (q) {
        if (!(q.id in parsed.answers)) parsed.answers[q.id] = null;
      });
      // Backfill counters that may be missing on logs written by older versions.
      if (typeof parsed.prompt_count        !== 'number') parsed.prompt_count        = 0;
      if (typeof parsed.response_count      !== 'number') parsed.response_count      = 0;
      if (typeof parsed.query_count         !== 'number') parsed.query_count         = 0;
      if (typeof parsed.click_count         !== 'number') parsed.click_count         = 0;
      if (typeof parsed.judge_call_count    !== 'number') parsed.judge_call_count    = 0;
      if (typeof parsed.judge_failure_count !== 'number') parsed.judge_failure_count = 0;
      // Stamp arm + judge metadata onto restored logs that pre-date these fields.
      if (parsed.arm === undefined)         parsed.arm         = (parsed.condition === 'LLM') ? ARM : null;
      if (parsed.judge_model === undefined) parsed.judge_model = RCT_JUDGE_ENABLED ? RCT_JUDGE_MODEL : null;
      if (parsed.judge_mode  === undefined) parsed.judge_mode  = RCT_JUDGE_ENABLED ? RCT_JUDGE_MODE  : 'off';
      // Multi-question backfill for logs written before the multi-question flow.
      if (typeof parsed.current_question_index !== 'number') {
        // Derive index from existing answer_final events so refresh-mid-flow restores correctly.
        var finalised = {};
        (parsed.events || []).forEach(function (e) {
          if (e.type === 'answer_final' && e.question_id) finalised[e.question_id] = true;
        });
        var idx = 0;
        for (var i = 0; i < QUESTIONS.length; i++) {
          if (!finalised[QUESTIONS[i].id]) { idx = i; break; }
          idx = i + 1;
        }
        parsed.current_question_index = Math.min(idx, QUESTIONS.length - 1);
      }
      if (typeof parsed.question_count !== 'number') parsed.question_count = QUESTIONS.length;
      return parsed;
    } catch (e) {
      console.warn('[RCT] failed to load stored log:', e);
      return null;
    }
  }

  function saveLog() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); } catch (e) {}
  }

  /* ==================================================================
   * CR scoring — client-side accuracy computation (Layer 1)
   *
   * computeCRScore() returns { total, correct, near, nearCorrect,
   * far, farCorrect, items: [{id, answer, correct, isCorrect}] }.
   * Placeholder items (A-VH4) are excluded from scoring.
   * ================================================================== */
  function computeCRScore() {
    var total = 0, correct = 0;
    var near = 0, nearCorrect = 0;
    var far = 0, farCorrect = 0;
    var items = [];
    QUESTIONS.forEach(function (q) {
      if (q.placeholder) return;       // exclude placeholder items from scoring
      var answer = log.answers[q.id];
      var isCorrect = (answer === q.correct) ? 1 : 0;
      total++;
      correct += isCorrect;
      // Near-transfer = assumption items; far-transfer = flaw/weaken items
      if (q.subtype === 'assumption') {
        near++; nearCorrect += isCorrect;
      } else {
        far++; farCorrect += isCorrect;
      }
      items.push({ id: q.id, answer: answer, correct: q.correct, isCorrect: isCorrect });
    });
    return {
      total: total, correct: correct,
      near: near, nearCorrect: nearCorrect,
      far: far, farCorrect: farCorrect,
      items: items
    };
  }

  // VLAT training summary for the Qualtrics bridge. There is NO client-side
  // answer key, so this carries only responses (not correctness): per-item
  // {id, raw_id, chart, format, answer} in presentation order, plus counts.
  // Correctness is computed offline (vlat_scoring.js).
  function computeVLATSummary() {
    var total = QUESTIONS.length, answered = 0, attempted = 0;
    var items = [];
    QUESTIONS.forEach(function (q) {
      var answer = log.answers[q.id];
      if (answer != null) answered++;
      if (answer != null && answer !== 'idk') attempted++;
      items.push({
        id: q.id, raw_id: q.raw_id, chart_id: q.chartId,
        chart_type: q.chartType, format: q.format, answer: answer
      });
    });
    return { total: total, answered: answered, attempted: attempted, items: items };
  }

  function persist() {
    saveLog();
    var payload = { type: 'rct_log_update', payload: log };
    // Attach VLAT response data so the Qualtrics bridge can flatten it to
    // Embedded Data (responses only — correctness is scored offline).
    if (IS_VLAT_MODE) {
      var vs = computeVLATSummary();
      payload.vlat_total     = vs.total;
      payload.vlat_answered  = vs.answered;
      payload.vlat_attempted = vs.attempted;
      payload.vlat_items     = vs.items;
      // Per-question consolidated array: each item's answer + that question's
      // interaction trace (LLM turns+judge / SEARCH queries+clicks), built by
      // the canonical pcp_consolidate.js transform. The Qualtrics bridge writes
      // this to ONE Embedded Data field. Guarded: if the module didn't load,
      // the raw log + vlat_items still ship, so no data is lost.
      if (window.PCP_CONSOLIDATE) {
        payload.vlat_consolidated = window.PCP_CONSOLIDATE.consolidate(log.events, vs.items, CONDITION);
      }
    }
    // Attach CR scoring data so Qualtrics bridge can flatten to Embedded Data
    if (IS_CR_MODE) {
      var score = computeCRScore();
      payload.cr_score = score.correct;
      payload.cr_total = score.total;
      payload.cr_near  = score.nearCorrect;
      payload.cr_near_total = score.near;
      payload.cr_far   = score.farCorrect;
      payload.cr_far_total  = score.far;
      payload.cr_items = score.items;
    }
    postToParent(payload);
    persistToServer();  // server-side backup via Cloudflare KV
  }

  /* ==================================================================
   * Server-side persistence — POST to Cloudflare Worker /log endpoint.
   * Fire-and-forget: never blocks the UI, failures logged to console.
   * ================================================================== */
  function persistToServer() {
    var body = { log: log };
    if (IS_VLAT_MODE) {
      body.vlat = computeVLATSummary();
    }
    if (IS_CR_MODE) {
      var score = computeCRScore();
      body.cr = {
        cr_score: score.correct,
        cr_total: score.total,
        cr_near:  score.nearCorrect,
        cr_near_total: score.near,
        cr_far:   score.farCorrect,
        cr_far_total:  score.far,
        cr_items: score.items
      };
    }
    fetch(PROXY_URL + 'log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(function(e) {
      console.warn('[RCT] server persist failed:', e);
    });
  }

  function logEvent(evt) {
    evt.ts = isoNow();
    // Tag every event with the question_id it belongs to, so per-question
    // analysis is trivial. Caller can pass an explicit question_id; otherwise
    // we stamp the current question's id automatically. We never overwrite
    // an explicitly-provided question_id.
    if (evt.question_id === undefined) {
      var q = currentQuestion();
      if (q) evt.question_id = q.id;
    }
    log.events.push(evt);
  }

  function currentQuestion() {
    var idx = (log && typeof log.current_question_index === 'number') ? log.current_question_index : 0;
    if (idx < 0) idx = 0;
    if (idx >= QUESTIONS.length) idx = QUESTIONS.length - 1;
    return QUESTIONS[idx];
  }

  function isLastQuestion() {
    return (log.current_question_index >= QUESTIONS.length - 1);
  }

  var log = loadLog() || newLog();

  /* ==================================================================
   * DOM construction
   * ================================================================== */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function buildDom() {
    var rightHtml;
    if (CONDITION === 'NOAID') {
      // No tool panel — the right pane is hidden via CSS (.is-noaid).
      // We still emit the <section> for DOM consistency, but it's display:none.
      rightHtml = '';
    } else if (CONDITION === 'LLM') {
      // Share-chart toolbar is rendered only for the UNRESTRICTED arm in
      // chart mode. In CR mode, there's no chart to share.
      // The Socratic arm intentionally omits it: sharing the chart image
      // would let the model compute the answer directly, defeating the
      // probe-only scaffold the Socratic prompt enforces.
      var shareToolbarHtml = (!IS_CR_MODE && ARM === 'unrestricted')
        ? '<div id="rct-share-toolbar">' +
            '<button id="rct-share-chart-btn" type="button" class="rct-button rct-button-secondary" title="' + esc(t('share_chart_title')) + '">' +
              '<span aria-hidden="true" style="margin-right:6px">📊</span>' + esc(t('share_chart')) +
            '</button>' +
            '<span id="rct-share-chart-status" aria-live="polite"></span>' +
          '</div>'
        : '';
      var chatPlaceholder = IS_CR_MODE
        ? t('chat_placeholder_cr')
        : t('chat_placeholder_chart');
      rightHtml =
        '<div id="right-panel-llm">' +
          '<div id="rct-chat-log" role="log" aria-live="polite" aria-label="' + esc(t('aria_chat_log')) + '"></div>' +
          '<div id="rct-chat-typing" style="display:none">' + esc(t('typing')) + '</div>' +
          shareToolbarHtml +
          '<form id="rct-chat-form" autocomplete="off">' +
            '<input id="rct-chat-input" type="text" placeholder="' + esc(chatPlaceholder) + '" maxlength="1000" />' +
            '<button id="rct-chat-send" type="submit" class="rct-button rct-button-primary">' + esc(t('send')) + '</button>' +
          '</form>' +
        '</div>';
    } else {
      rightHtml =
        '<div id="right-panel-search">' +
          '<form id="rct-search-form" autocomplete="off" role="search">' +
            '<input id="rct-search-input" type="text" placeholder="' + esc(t('search_placeholder')) + '" maxlength="200" />' +
            '<button id="rct-search-button" type="submit" class="rct-button rct-button-primary">' + esc(t('search_btn')) + '</button>' +
          '</form>' +
          '<div id="rct-search-spinner" style="display:none">' + esc(t('searching')) + '</div>' +
          '<div id="rct-search-results" aria-live="polite"></div>' +
          // In-panel result viewer (hidden until a click). Loads the
          // destination URL inside the right pane so the chart +
          // question on the left stay visible. Sites that block
          // iframing trigger the .is-blocked fallback.
          '<div id="rct-result-frame-container" aria-live="polite">' +
            '<div class="rct-result-frame-bar">' +
              '<button id="rct-result-frame-back" type="button" aria-label="' + esc(t('search_back_aria')) + '">' + esc(t('search_back')) + '</button>' +
              '<span id="rct-result-frame-url" title=""></span>' +
              '<a id="rct-result-frame-newtab" href="#" target="_blank" rel="noopener noreferrer">' + esc(t('search_newtab')) + '</a>' +
            '</div>' +
            '<iframe id="rct-result-frame" src="about:blank" referrerpolicy="no-referrer" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>' +
            '<div id="rct-result-frame-blocked">' +
              t('result_blocked') +
            '</div>' +
          '</div>' +
        '</div>';
    }
    var leftPaneHeader = IS_VLAT_MODE ? t('pane_vlat') : (IS_CR_MODE ? t('pane_cr') : t('pane_company'));
    var leftPaneLabel = IS_VLAT_MODE ? t('aria_left_vlat') : (IS_CR_MODE ? t('aria_left_cr') : t('aria_left_chart'));
    root.innerHTML =
      '<header class="rct-instructions">' + INSTRUCTIONS_HTML + '</header>' +
      '<div class="rct-panes">' +
        '<section class="rct-pane rct-left" aria-label="' + esc(leftPaneLabel) + '">' +
          '<div class="rct-pane-header">' + esc(leftPaneHeader) + '</div>' +
          (IS_CR_MODE ? '<div class="cr-stem-area" id="cr-stem-root"></div>' : '') +
          '<div class="rct-chart-area" id="chart-root"></div>' +
          '<div class="rct-question-block" id="question-area"></div>' +
        '</section>' +
        '<section class="rct-pane rct-right" aria-label="' + esc(t('aria_right')) + '">' +
          '<div class="rct-pane-header">' + esc(t('pane_tools')) + '</div>' +
          rightHtml +
        '</section>' +
      '</div>';

    // CR mode: add class that hides chart area via CSS
    if (IS_CR_MODE) {
      root.classList.add('is-cr');
    }
    // NOAID: add class that hides the right pane and centres the left pane
    if (CONDITION === 'NOAID') {
      root.classList.add('is-noaid');
    }
  }

  function $(sel)  { return root.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }

  /* ==================================================================
   * Chart, questions, and treatment renderers
   * ================================================================== */
  var _chartRendered = false;
  function renderChart() {
    if (IS_VLAT_MODE) { renderVLATChart(); return; }   // VLAT: per-question PNG, re-rendered each item
    if (IS_CR_MODE) return;       // CR mode has no chart — stem is rendered by renderQuestions
    if (_chartRendered) return;
    var holder = $('#chart-root');
    if (!holder) return;
    var chart = SHARED_CHART;
    var bps = chart.boxplots || [];
    var paneHeader = root.querySelector('.rct-left .rct-pane-header');
    if (paneHeader) paneHeader.textContent = chart.title || 'Chart';
    if (!bps.length) { holder.innerHTML = ''; return; }

    var W = 480, H = 330;
    var pad = { top: 44, right: 16, bottom: 76, left: 60 };
    var plotW = W - pad.left - pad.right;
    var plotH = H - pad.top - pad.bottom;
    var yMaxVal = chart.yMax || 250;
    function yOf(v) { return pad.top + plotH - (v / yMaxVal) * plotH; }

    var step = plotW / bps.length;
    var boxW = step * 0.42;

    var ticks = [];
    var tickStep = yMaxVal / 5;
    for (var t = 0; t <= 5; t++) ticks.push(t * tickStep);

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(chart.title) + '" class="rct-chart-svg">';
    svg += '<text x="' + (W / 2) + '" y="18" text-anchor="middle" class="rct-chart-title">' + esc(chart.title) + '</text>';
    if (chart.subtitle) {
      svg += '<text x="' + (W / 2) + '" y="34" text-anchor="middle" style="font-size:10px;fill:#78909c">' + esc(chart.subtitle) + '</text>';
    }
    svg += '<text x="-' + (pad.top + plotH / 2) + '" y="14" transform="rotate(-90)" text-anchor="middle" class="rct-chart-axis-label">' + esc(chart.yLabel) + '</text>';

    ticks.forEach(function (tv) {
      var y = yOf(tv);
      svg += '<line x1="' + pad.left + '" y1="' + y + '" x2="' + (pad.left + plotW) + '" y2="' + y + '" class="rct-chart-grid"/>';
      svg += '<text x="' + (pad.left - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="rct-chart-tick">' + tv + '</text>';
    });

    svg += '<line x1="' + pad.left + '" y1="' + pad.top + '" x2="' + pad.left + '" y2="' + (pad.top + plotH) + '" class="rct-chart-axis"/>';
    svg += '<line x1="' + pad.left + '" y1="' + yOf(0) + '" x2="' + (pad.left + plotW) + '" y2="' + yOf(0) + '" class="rct-chart-axis"/>';

    bps.forEach(function (bp, i) {
      var cx = pad.left + i * step + step / 2;
      var x1 = cx - boxW / 2;
      var x2 = cx + boxW / 2;
      var capHalf = boxW * 0.3;
      var yMin = yOf(bp.min), yQ1 = yOf(bp.q1), yMed = yOf(bp.median), yQ3 = yOf(bp.q3), yMx = yOf(bp.max);

      svg += '<line x1="' + cx + '" y1="' + yMin + '" x2="' + cx + '" y2="' + yQ1 + '" stroke="' + bp.color + '" stroke-width="1.5" stroke-dasharray="4,3"/>';
      svg += '<line x1="' + cx + '" y1="' + yQ3 + '" x2="' + cx + '" y2="' + yMx + '" stroke="' + bp.color + '" stroke-width="1.5" stroke-dasharray="4,3"/>';
      svg += '<line x1="' + (cx - capHalf) + '" y1="' + yMin + '" x2="' + (cx + capHalf) + '" y2="' + yMin + '" stroke="' + bp.color + '" stroke-width="1.5"/>';
      svg += '<line x1="' + (cx - capHalf) + '" y1="' + yMx  + '" x2="' + (cx + capHalf) + '" y2="' + yMx  + '" stroke="' + bp.color + '" stroke-width="1.5"/>';
      svg += '<rect x="' + x1 + '" y="' + yQ3 + '" width="' + boxW + '" height="' + (yQ1 - yQ3) + '" fill="' + bp.color + '" fill-opacity="0.2" stroke="' + bp.color + '" stroke-width="1.5" rx="2"/>';
      svg += '<line x1="' + x1 + '" y1="' + yMed + '" x2="' + x2 + '" y2="' + yMed + '" stroke="' + bp.color + '" stroke-width="2.5"/>';

      (bp.outliers || []).forEach(function (ov) {
        svg += '<circle cx="' + cx + '" cy="' + yOf(ov) + '" r="4" fill="none" stroke="' + bp.color + '" stroke-width="1.5"/>';
      });

      var labelY = pad.top + plotH + 18;
      svg += '<text x="' + cx + '" y="' + labelY + '" text-anchor="middle" style="font-size:12px;fill:#333;font-weight:500">' + esc(bp.label) + '</text>';
      svg += '<text x="' + cx + '" y="' + (labelY + 16) + '" text-anchor="middle" style="font-size:10px;fill:#888;font-style:italic">N = ' + bp.n + ' weeks</text>';
    });

    if (chart.footnote) {
      svg += '<text x="' + (W / 2) + '" y="' + (H - 4) + '" text-anchor="middle" style="font-size:9px;fill:#999">' + esc(chart.footnote) + '</text>';
    }
    svg += '</svg>';
    holder.innerHTML = svg;
    _chartRendered = true;
  }

  // Render the current VLAT chart as a PNG image (charts/<chartId>.png).
  // Unlike the legacy SVG boxplot, this re-renders on every question because
  // each item may use a different chart. A missing image degrades to a
  // labelled placeholder rather than a broken-image icon.
  function renderVLATChart() {
    var holder = $('#chart-root');
    if (!holder) return;
    var q = currentQuestion();
    if (!q) { holder.innerHTML = ''; return; }
    var title = q.chartTitle || q.chartType || 'Chart';
    var paneHeader = root.querySelector('.rct-left .rct-pane-header');
    if (paneHeader) paneHeader.textContent = title;
    var src = 'charts/' + q.chartId + '.png';
    holder.innerHTML =
      '<figure style="margin:0">' +
        '<img class="vlat-chart-img" src="' + esc(src) + '" ' +
             'alt="' + esc(title) + '" ' +
             'style="width:100%;height:auto;display:block;border:1px solid #eceff1;border-radius:4px;background:#fff" ' +
             'onerror="this.style.display=\'none\';var f=this.parentNode.querySelector(\'.vlat-chart-missing\');if(f)f.style.display=\'block\';" />' +
        '<div class="vlat-chart-missing" style="display:none;padding:32px;text-align:center;color:#90a4ae;border:1px dashed #cfd8dc;border-radius:4px">' + esc(t('chart_unavailable')) + '<br/><code style="font-size:11px">charts/' + esc(q.chartId) + '.png</code></div>' +
        '<figcaption style="margin-top:6px;font-size:12px;color:#607d8b">' + esc(LANG === 'DE' && q.chartType === 'Parallel Coordinates' ? 'Parallelkoordinaten' : q.chartType) + '</figcaption>' +
      '</figure>';
    postHeight();
  }

  // Render the CR stem area (passage + prompt) above the question options.
  // Called from renderQuestions() when IS_CR_MODE is true.
  function renderCRStem(q) {
    var stemHolder = $('#cr-stem-root');
    if (!stemHolder) return;
    if (!q || q.type !== 'cr') { stemHolder.innerHTML = ''; return; }
    var html = '';
    if (q.placeholder) {
      html += '<p class="cr-item-meta">' + esc(t('placeholder_item')) + '</p>';
    }
    html += '<p class="cr-stem-text">' + esc(q.stem) + '</p>';
    html += '<p class="cr-prompt-text">' + esc(q.prompt) + '</p>';
    stemHolder.innerHTML = html;
  }

  function renderQuestions() {
    var holder = $('#question-area');
    if (!holder) return;
    var q = currentQuestion();
    if (!q) { holder.innerHTML = ''; return; }
    var idx = log.current_question_index;

    // Render CR stem in its dedicated area (above the question block)
    if (IS_CR_MODE) renderCRStem(q);

    var html = '';
    html += '<p class="rct-question-progress">' + esc(tf('q_progress', { n: idx + 1, m: QUESTIONS.length })) + '</p>';
    html += '<div class="rct-question" data-qid="' + esc(q.id) + '">';

    if (q.type === 'cr') {
      // CR mode: the stem + prompt are shown in the dedicated cr-stem-area above.
      // Here we only render the answer options (A–E).
      var name = 'rct-' + q.id;
      html += '<div class="rct-question-options">';
      q.options.forEach(function (opt) {
        html += '<label class="rct-option"><input type="radio" name="' + name + '" value="' + esc(opt.key) + '"/><span>' + esc(opt.key + ') ' + opt.text) + '</span></label>';
      });
      html += '<label class="rct-option rct-option-idk"><input type="radio" name="' + name + '" value="idk"/><span>' + esc(t('idk')) + '</span></label>';
      html += '</div>';
    } else if (q.type === 'vlat') {
      // VLAT mode: chart shown above (renderVLATChart); here we render the
      // question text + its MC (A–D) or True/False options, plus optional omit.
      html += '<p class="rct-question-text">' + esc(q.text) + '</p>';
      var name = 'rct-' + q.id;
      html += '<div class="rct-question-options">';
      q.options.forEach(function (opt) {
        var display = (q.format === 'tf') ? opt.text : (opt.key + ') ' + opt.text);
        html += '<label class="rct-option"><input type="radio" name="' + name + '" value="' + esc(opt.key) + '"/><span>' + esc(display) + '</span></label>';
      });
      if (q.hasOmit) {
        html += '<label class="rct-option rct-option-idk"><input type="radio" name="' + name + '" value="idk"/><span>' + esc(t('idk')) + '</span></label>';
      }
      html += '</div>';
    } else {
      // Legacy chart mode: True/False or multichoice
      html += '<p class="rct-question-text">' + esc(q.text) + '</p>';
      var name = 'rct-' + q.id;
      html += '<div class="rct-question-options">';
      if (q.type === 'multichoice' && q.options) {
        q.options.forEach(function (opt) {
          html += '<label class="rct-option"><input type="radio" name="' + name + '" value="' + esc(opt.key) + '"/><span>' + esc(opt.key + ') ' + opt.text) + '</span></label>';
        });
      } else if (q.type === 'truefalse') {
        html += '<label class="rct-option"><input type="radio" name="' + name + '" value="true"/><span>' + esc(t('tf_true')) + '</span></label>';
        html += '<label class="rct-option"><input type="radio" name="' + name + '" value="false"/><span>' + esc(t('tf_false')) + '</span></label>';
      }
      html += '<label class="rct-option rct-option-idk"><input type="radio" name="' + name + '" value="idk"/><span>' + esc(t('idk')) + '</span></label>';
      html += '</div>';
    }
    html += '</div>';
    var btnLabel = isLastQuestion() ? t('btn_finish') : t('btn_next');
    html += '<button type="button" id="rct-submit-final" class="rct-button rct-button-primary" disabled>' + esc(btnLabel) + '</button>';
    var hintText = isLastQuestion() ? t('hint_finish') : t('hint_next');
    html += '<p class="rct-submit-hint">' + esc(hintText) + '</p>';
    holder.innerHTML = html;

    $$('input[name="' + name + '"]').forEach(function (input) {
      input.addEventListener('change', function () {
        onAnswerChange(q.id, input.value);
        $$('.rct-option').forEach(function (lbl) { lbl.classList.remove('is-selected'); });
        var parent = input.closest('.rct-option');
        if (parent) parent.classList.add('is-selected');
      });
    });
    var v = log.answers[q.id];
    if (v != null) {
      var sel = $('input[name="' + name + '"][value="' + v + '"]');
      if (sel) { sel.checked = true; var p = sel.closest('.rct-option'); if (p) p.classList.add('is-selected'); }
    }
    $('#rct-submit-final').addEventListener('click', onSubmitCurrent);
    refreshSubmitState();
  }

  function currentAnswered() {
    var q = currentQuestion();
    return q && log.answers[q.id] != null;
  }

  function allAnswered() {
    return QUESTIONS.every(function (q) {
      return log.answers[q.id] != null;
    });
  }

  function refreshSubmitState() {
    var btn = $('#rct-submit-final');
    if (!btn) return;
    btn.disabled = !currentAnswered() || isFinalised();
  }

  function isFinalised() {
    // Finalised = the LAST question's answer_final event has been logged.
    // While participants advance through earlier questions, isFinalised
    // stays false (each per-question submit logs answer_final for that
    // question only). This gates lockPanel / busy disabling.
    var lastId = QUESTIONS.length ? QUESTIONS[QUESTIONS.length - 1].id : null;
    if (!lastId) return false;
    return log.events.some(function (e) {
      return e.type === 'answer_final' && e.question_id === lastId;
    });
  }

  function onAnswerChange(qid, value) {
    if (isFinalised()) return;
    log.answers[qid] = value;
    logEvent({ type: 'answer_change', question_id: qid, value: value });
    persist();
    refreshSubmitState();
  }

  function onSubmitCurrent() {
    if (!currentAnswered() || isFinalised()) return;
    // If the participant is currently viewing a result in the right
    // panel, close the viewer first so the dwell event is logged with
    // the correct reason and chronology.
    if (typeof closeResultInPanel === 'function' && _viewingResult) {
      closeResultInPanel('submit_final');
    }
    var q = currentQuestion();
    logEvent({ type: 'answer_final', question_id: q.id, value: log.answers[q.id] });

    if (isLastQuestion()) {
      // Final submit — lock panel and complete.
      lockPanel();
      persist();
      postToParent({ type: 'rct_complete' });
      var btn = $('#rct-submit-final');
      if (btn) { btn.disabled = true; btn.textContent = t('submitted'); }
      $$('input[type="radio"]').forEach(function (i) { i.disabled = true; });
      var hint = $('.rct-submit-hint');
      if (hint) hint.textContent = t('all_recorded');
      postHeight();
    } else {
      // Advance to the next question.
      log.current_question_index += 1;
      logEvent({ type: 'question_advanced', question_id: QUESTIONS[log.current_question_index].id, advanced_to_index: log.current_question_index });
      persist();
      advanceToNextQuestion();
    }
  }

  // Called after current_question_index has been incremented. Re-renders
  // the chart/stem + question, and optionally clears the right-panel UI so
  // the participant starts each item with a fresh treatment surface.
  function advanceToNextQuestion() {
    if (!IS_CR_MODE) renderChart();      // CR mode has no chart to render
    renderQuestions();                    // also updates CR stem via renderCRStem()
    if (CONDITION === 'LLM') {
      if (RESET_CHAT_BETWEEN_QUESTIONS) {
        var logEl = $('#rct-chat-log'); if (logEl) logEl.innerHTML = '';
        var input = $('#rct-chat-input'); if (input) { input.value = ''; input.disabled = false; }
        var sendBtn = $('#rct-chat-send'); if (sendBtn) sendBtn.disabled = false;
      } else {
        replayChat();
      }
      // Reset the Share-chart button so the new question starts fresh.
      // The participant can share the new chart once; sharing is scoped
      // per-question by the context_share event's question_id.
      refreshShareChartUI();
    } else if (CONDITION === 'SEARCH') {
      if (RESET_SEARCH_BETWEEN_QUESTIONS) {
        var results = $('#rct-search-results'); if (results) results.innerHTML = '';
        var sin = $('#rct-search-input'); if (sin) { sin.value = ''; sin.disabled = false; }
        var sbtn = $('#rct-search-button'); if (sbtn) sbtn.disabled = false;
        if (typeof closeResultInPanel === 'function' && _viewingResult) {
          closeResultInPanel('next_question');
        }
      } else {
        replaySearch();
      }
    }
    postHeight();
  }

  function lockPanel() {
    if (!log.events.some(function (e) { return e.type === 'panel_locked'; })) {
      logEvent({ type: 'panel_locked' });
    }
    var rp = $('.rct-right');
    if (rp) rp.classList.add('is-locked');
    ['#rct-chat-input', '#rct-chat-send', '#rct-share-chart-btn',
     '#rct-search-input', '#rct-search-button',
     '#rct-result-frame-back'].forEach(function (sel) {
      var el = $(sel); if (el) el.disabled = true;
    });
  }

  /* ==================================================================
   * LLM chat (multi-turn via OpenRouter)
   * ================================================================== */
  function wireChat() {
    var form = $('#rct-chat-form');
    var input = $('#rct-chat-input');
    if (!form || !input) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendChat(text);
    });
  }

  /* ==================================================================
   * Share chart with assistant (unrestricted arm only).
   *
   * Clicking the button injects the current chart image (PNG rasterised
   * from the live SVG) plus a structured text block (title, y-axis,
   * data points, and the True/False claim) into the conversation as a
   * multimodal user message. This message is added to the LLM's view
   * of history on the next prompt — it is NOT immediately sent as a
   * standalone request, so the participant must still type something
   * to get a response that incorporates the shared context.
   *
   * One share per question. The button disables after click and a
   * confirmation chip is rendered into the chat log so the participant
   * sees that the chart has been attached. The advance-to-next-question
   * flow resets this state.
   *
   * Image data is held in an in-memory cache (NOT in the persisted log)
   * and re-rendered from QUESTIONS[i].chart on refresh. The context_share
   * event itself is persisted so we know the participant shared, and so
   * rctBuildMessagesFromLog can reconstruct the multimodal message after
