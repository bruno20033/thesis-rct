<!--
  LLM-CONDITION QUALTRICS QUESTION TEXT
  ====================================================================
  Paste the single <iframe> line below into the LLM Text Entry
  question's Question Text via the rich-text editor → Source view
  (the <> button). Do NOT paste this comment.

  This same question serves BOTH LLM arms — Socratic and Unrestricted.
  The Survey Flow Randomizer sets the `arm` Embedded Data field per
  branch (e.g. `arm = socratic` on Branch 2, `arm = unrestricted` on
  Branch 3); the iframe pipes that value into the embed via the
  ${e://Field/arm} expression.

  Piped-text expressions used:
    ${e://Field/arm}         → 'socratic' or 'unrestricted', set by
                                the Randomizer's Embedded-Data step.
    ${e://Field/ResponseID}  → Qualtrics' built-in unique participant
                                id for this response.

  Companion JS in qualtrics-question-js.js handles the postMessage
  bridge from the iframe to Qualtrics Embedded Data.
  ====================================================================
-->
<iframe
  src="https://bruno20033.github.io/thesis-rct/embed.html?condition=LLM&arm=${e://Field/arm}&pid=${e://Field/ResponseID}"
  width="100%"
  height="800"
  frameborder="0"
  style="border:none; display:block; width:100%; min-height:700px;"
  allow="clipboard-write"
  title="Research tools — LLM condition">
</iframe>
