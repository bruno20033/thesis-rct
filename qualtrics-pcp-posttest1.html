<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCP Post-test 1 (immediate)</title>
<!--
  PCP LITERACY POST-TEST 1 — immediate, UNAIDED outcome measure (RQ1, primary).
  =============================================================================
  Self-contained renderer, hosted on GitHub Pages and embedded in Qualtrics via
    <iframe src="https://bruno20033.github.io/thesis-rct/qualtrics-pcp-posttest1.html?pid=${e://Field/ResponseID}&lang=${e://Field/Q_Language}">
  with qualtrics-pcp-js.js pasted into the question's "Add JavaScript" panel.

  Shows the 16 block:"posttest1" items from pcp_items_data.js (4 per Bloom level),
  one at a time, NO tool access. Records the participant's chosen option LETTER,
  answer time, confidence (1–7), confidence time, and timeout flag per item,
  then posts them to the existing bridge. See OUTCOME_CONFIDENCE.md.

  NO ANSWER KEY ships here on purpose — this page is participant-facing and must
  not expose correct answers. Correctness is scored OFFLINE from pcp_<id>_response
  against PCP_KEY in pcp_scoring.js. Bilingual: EN base + DE overlay
  (pcp_items_de.js); the UI + item text follow ?lang= (from Q_Language).
  =============================================================================
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #fff; color: #1a1a2e; padding: 24px; max-width: 820px; margin: 0 auto; }

  /* Progress & Timer */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .progress { font-size: 0.9rem; color: #495057; font-weight: 600; }
  .progress-bar { width: 200px; height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: #228be6; transition: width 0.3s; }
  .timer { font-size: 1.1rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; background: #f1f3f5; }
  .timer.warning { background: #fff3bf; color: #e67700; }
  .timer.critical { background: #ffe3e3; color: #c92a2a; }

  /* Chart */
  .chart-container { text-align: center; margin-bottom: 24px; }
  .chart-container img { max-width: 760px; width: 100%; border: 1px solid #dee2e6; border-radius: 8px; cursor: zoom-in; }
  .chart-loading { width: 100%; max-width: 760px; aspect-ratio: 1; margin: 0 auto;
                   display: flex; flex-direction: column; align-items: center; justify-content: center;
                   gap: 16px; background: #f8f9fa; border: 2px dashed #ced4da;
                   border-radius: 8px; color: #495057; font-weight: 600; }
  .chart-loading-spinner { width: 38px; height: 38px; border: 4px solid #d0ebff;
                           border-top-color: #228be6; border-radius: 50%;
                           animation: chart-spin .8s linear infinite; }
  @keyframes chart-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .chart-loading-spinner { animation: none; } }
  .chart-placeholder { max-width: 760px; margin: 0 auto; padding: 60px 40px; background: #f8f9fa;
                        border: 2px dashed #ced4da; border-radius: 8px; color: #868e96; text-align: center; }
  .chart-placeholder .title { font-size: 1.1rem; font-weight: 600; color: #495057; margin-bottom: 8px; }
  .chart-placeholder .hint { font-size: 0.85rem; }

  /* Zoom overlay */
  #zoom-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
                  z-index: 9999; align-items: center; justify-content: center; }
  #zoom-overlay.active { display: flex; }
  #zoom-overlay img { max-width: 95vw; max-height: 92vh; object-fit: contain; border-radius: 4px;
                      box-shadow: 0 4px 32px rgba(0,0,0,0.5); }
  #zoom-close { position: fixed; top: 16px; right: 20px; font-size: 2.5rem; color: #fff;
                cursor: pointer; line-height: 1; background: none; border: none; padding: 0; opacity: 0.85; }
  #zoom-close:hover { opacity: 1; }

  /* Question */
  .question-text { font-size: 1.15rem; line-height: 1.5; margin-bottom: 20px; font-weight: 500; }
  .instructions { color: #495057; line-height: 1.5; margin-bottom: 16px; }

  /* Options */
  .options { list-style: none; margin-bottom: 20px; }
  .option { display: flex; align-items: center; padding: 12px 16px; margin-bottom: 8px;
            border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  .option:hover { border-color: #228be6; background: #f0f7ff; }
  .option.selected { border-color: #228be6; background: #e7f5ff; }
  .option input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
  .option label { cursor: pointer; flex: 1; font-size: 1rem; }
  .option .label-key { font-weight: 700; color: #228be6; margin-right: 8px; }
  .options.locked .option { cursor: default; }
  .options.locked .option:not(.selected):hover { border-color: #e9ecef; background: #fff; }

  /* The native modal makes the confirmed answer inert and contains keyboard focus. */
  .confidence-panel { margin: auto; padding: 24px; border: 1px solid #dee2e6; border-radius: 12px;
                      width: min(480px, calc(100% - 32px)); max-height: calc(100% - 32px);
                      overflow: auto; color: #1a1a2e; box-shadow: 0 12px 48px rgba(0,0,0,.2); }
  .confidence-panel::backdrop { background: rgba(20,30,40,.55); }
  .confidence-panel h2 { font-size: 1.2rem; line-height: 1.4; margin-bottom: 12px; }
  .confidence-help { color: #495057; line-height: 1.5; }
  .confidence-value { display: block; margin: 20px 0 8px; min-height: 24px; text-align: center; font-weight: 600; }
  .confidence-slider { display: block; width: 100%; height: 36px; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
  .confidence-slider::-webkit-slider-runnable-track { height: 6px; background: #ced4da; border-radius: 3px; }
  .confidence-slider::-moz-range-track { height: 6px; background: #ced4da; border-radius: 3px; }
  .confidence-slider::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; background: #228be6; border-radius: 50%; }
  .confidence-slider::-moz-range-thumb { width: 24px; height: 24px; border: 0; background: #228be6; border-radius: 50%; }
  .confidence-slider[data-unanswered]::-webkit-slider-thumb { opacity: 0; }
  .confidence-slider[data-unanswered]::-moz-range-thumb { opacity: 0; }
  .confidence-slider:focus-visible { outline: 2px solid #228be6; outline-offset: 4px; border-radius: 4px; }
  .confidence-ticks { display: flex; justify-content: space-between; padding: 0 8px; color: #495057; font-variant-numeric: tabular-nums; }
  .confidence-anchors { display: flex; justify-content: space-between; gap: 24px; margin: 8px 0 24px; line-height: 1.4; color: #495057; }
  .confidence-anchors span { max-width: 45%; }
  .confidence-anchors span:last-child { text-align: right; }
  @media (max-width: 560px) {
    .progress-bar { width: 150px; }
  }

  /* Next button */
  .btn-next { display: block; margin: 0 auto; padding: 12px 48px; font-size: 1rem; font-weight: 600;
              background: #228be6; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .btn-next:hover { background: #1c7ed6; }
  .btn-next:disabled { background: #adb5bd; cursor: not-allowed; }

  /* Completion */
  .complete-screen { text-align: center; padding: 60px 20px; }
  .complete-screen h2 { font-size: 1.5rem; margin-bottom: 12px; color: #2b8a3e; }
  .complete-screen p { color: #495057; font-size: 1rem; }
</style>
</head>
<body>

<div id="quiz-container">
  <div class="top-bar">
    <div>
      <div id="question-progress" class="progress" tabindex="-1"><span id="lbl-question">Question</span> <span id="q-current">1</span> <span id="lbl-of">of</span> <span id="q-total">?</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="timer" class="timer"></div>
  </div>

  <p id="answer-instructions" class="instructions"></p>
  <div id="chart-area" class="chart-container"></div>
  <div id="question-text" class="question-text"></div>
  <ul id="options-list" class="options"></ul>
  <button id="btn-next" class="btn-next" disabled onclick="submitAnswer()">Next</button>
</div>

<dialog id="confidence-panel" class="confidence-panel" aria-labelledby="confidence-question" aria-describedby="confidence-help">
  <h2 id="confidence-question" tabindex="-1"></h2>
  <p id="confidence-help" class="confidence-help"></p>
  <output id="confidence-value" class="confidence-value" for="confidence-slider"></output>
  <input id="confidence-slider" class="confidence-slider" type="range" name="confidence" min="1" max="7" step="1" value="4"
         data-unanswered aria-labelledby="confidence-question" aria-describedby="confidence-help confidence-anchors">
  <div class="confidence-ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
  <p id="confidence-anchors" class="confidence-anchors"><span id="confidence-low"></span><span id="confidence-high"></span></p>
  <button id="btn-confidence" class="btn-next" disabled onclick="submitAnswer()">Next</button>
</dialog>

<div id="complete-screen" class="complete-screen" style="display:none">
  <h2 id="complete-title">Block Complete</h2>
  <p id="complete-msg">All answers recorded. Click the Next button at the bottom right to continue.</p>
</div>

<script src="pcp_items_data.js"></script>
<script src="pcp_items_de.js"></script>
<script>
(function () {
  // ── Configuration ──
  var BLOCK = 'posttest1';
  // Per-item time cap in seconds. TUNABLE: accuracy is the primary outcome, so
  // this is generous to avoid truncating slow-but-correct reads. Set to 0 to
  // disable the timer entirely (fully untimed; reaction time is still recorded).
  var TIME_LIMIT = 90;

  var params = new URLSearchParams(window.location.search);
  var pid = params.get('pid') || 'default';

  // ── Language (mirrors embed-pcp.html: ?lang= is fed from Qualtrics Q_Language) ──
  var LANG = ((params.get('lang') || 'EN').slice(0, 2)).toUpperCase();
  if (LANG !== 'DE') LANG = 'EN';
  try { document.documentElement.lang = LANG.toLowerCase(); } catch (e) {}
  var UI = {
    EN: { question: 'Question', of: 'of', next: 'Next', complete: 'Block Complete', recorded: 'All answers recorded. Click the Next button at the bottom right to continue.',
      confirm: 'Confirm answer', instructions: 'Choose your best answer, even if you are unsure. After confirming it, you will rate how confident you are that it is correct.',
      locked: 'Your answer is confirmed and cannot be changed. Please rate your confidence to continue.',
      confidence: 'How confident are you that your answer is correct?', low: 'Not at all confident', high: 'Very confident',
      help: 'Move the slider or tap a position to choose your rating from 1 to 7.', unselected: 'No rating selected' },
    DE: { question: 'Frage', of: 'von', next: 'Weiter', complete: 'Block abgeschlossen', recorded: 'Alle Antworten wurden gespeichert. Klicken Sie unten rechts auf „Weiter“, um fortzufahren.',
      confirm: 'Antwort bestätigen', instructions: 'Wählen Sie die Ihrer Meinung nach beste Antwort, auch wenn Sie unsicher sind. Nach der Bestätigung geben Sie an, wie sicher Sie sind, dass Ihre Antwort richtig ist.',
      locked: 'Ihre Antwort wurde bestätigt und kann nicht mehr geändert werden. Geben Sie bitte an, wie sicher Sie sind, um fortzufahren.',
      confidence: 'Wie sicher sind Sie, dass Ihre Antwort richtig ist?', low: 'Überhaupt nicht sicher', high: 'Sehr sicher',
      help: 'Verschieben Sie den Regler oder tippen Sie auf eine Position, um Ihre Bewertung von 1 bis 7 auszuwählen.', unselected: 'Noch keine Bewertung ausgewählt' }
  };
  var L = UI[LANG] || UI.EN;
  // loc(obj, field): German variant obj[field + '_de'] (from pcp_items_de.js) when LANG==='DE', else English.
  function loc(o, field) { if (LANG === 'DE' && o && o[field + '_de'] != null) return o[field + '_de']; return o ? o[field] : undefined; }

  // ── Items for this block ──
  var items = (typeof PCP_ITEMS !== 'undefined' ? PCP_ITEMS : []).filter(function (i) { return i.block === BLOCK; });
  if (items.length === 0) { document.body.innerHTML = '<p>No items found for block: ' + BLOCK + '</p>'; return; }

  // ── Seeded shuffle (per pid+block) so item order is counterbalanced but reproducible ──
  function seededRandom(seed) { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
  function hashString(str) { var h = 0; for (var i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; } return Math.abs(h); }
  function shuffleArray(arr, seed) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(seededRandom(seed + i) * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // Stratified interleave by Bloom level so the four levels are spread across the
  // block (no run of same-type items, e.g. three "Is this a PCP?" in a row). Order
  // within each level and the level rotation is shuffled per pid (counterbalanced).
  function stratifiedOrder(arr, seed) {
    var groups = {}, blooms = [];
    arr.forEach(function (it) { var b = it.bloom || 'x'; if (!groups[b]) { groups[b] = []; blooms.push(b); } groups[b].push(it); });
    blooms = shuffleArray(blooms, seed);
    blooms.forEach(function (b, k) { groups[b] = shuffleArray(groups[b], seed + 100 + k); });
    var out = [], maxLen = 0;
    blooms.forEach(function (b) { if (groups[b].length > maxLen) maxLen = groups[b].length; });
    for (var r = 0; r < maxLen; r++) blooms.forEach(function (b) { if (groups[b][r]) out.push(groups[b][r]); });
    return out;
  }
  items = stratifiedOrder(items, hashString(pid + '_' + BLOCK));
  var itemOrder = items.map(function (i) { return i.id; });

  // ── State ──
  var currentIndex = 0, selectedResponse = null, itemStartTime = 0;
  var phase = 'answer', selectedConfidence = null, answerRt = null, confidenceStartTime = 0;
  var timerInterval = null, timeRemaining = TIME_LIMIT, blockStartTime = Date.now();
  var responses = [];
  var chartReady = false;
  var chartPreloads = {};

  // ── DOM refs ──
  var elCurrent = document.getElementById('q-current');
  var elTotal = document.getElementById('q-total');
  var elProgressFill = document.getElementById('progress-fill');
  var elTimer = document.getElementById('timer');
  var elChart = document.getElementById('chart-area');
  var elQuestion = document.getElementById('question-text');
  var elOptions = document.getElementById('options-list');
  var elNext = document.getElementById('btn-next');
  var elInstructions = document.getElementById('answer-instructions');
  var elConfidence = document.getElementById('confidence-panel');
  var elConfidenceSlider = document.getElementById('confidence-slider');
  var elConfidenceValue = document.getElementById('confidence-value');
  var elConfidenceNext = document.getElementById('btn-confidence');
  elTotal.textContent = String(items.length);

  // A native range has a numeric midpoint even before a response. Only deliberate
  // pointer/keyboard interaction records it; focus and the initial value do not.
  elConfidence.addEventListener('cancel', function (e) { e.preventDefault(); });
  // Wrap Tab explicitly because the modal is embedded in an iframe: browser
  // focus must not move out to Qualtrics before the required rating is entered.
  elConfidence.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var last = elConfidenceNext.disabled ? elConfidenceSlider : elConfidenceNext;
    var active = document.activeElement;
    if (e.shiftKey && (active === elConfidenceSlider || active.id === 'confidence-question')) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && active === last) {
      e.preventDefault(); elConfidenceSlider.focus();
    }
  });
  elConfidenceSlider.addEventListener('input', function () { window.selectConfidence(this.value); });
  elConfidenceSlider.addEventListener('pointerup', function () { window.selectConfidence(this.value); });
  elConfidenceSlider.addEventListener('keyup', function (e) {
    if (/^(ArrowLeft|ArrowRight|ArrowUp|ArrowDown|Home|End|PageUp|PageDown)$/.test(e.key)) window.selectConfidence(this.value);
  });

  // Localize static chrome (labels/buttons) per LANG.
  (function localizeChrome() {
    var set = function (id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; };
    set('lbl-question', L.question);
    set('lbl-of', L.of);
    set('btn-next', L.next);
    set('complete-title', L.complete);
    set('complete-msg', L.recorded);
    set('confidence-question', L.confidence);
    set('confidence-help', L.help);
    set('confidence-low', L.low);
    set('confidence-high', L.high);
    set('btn-confidence', L.next);
  })();

  function post(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function sendHeight() { post({ type: 'rct_height', value: document.body.scrollHeight }); }
  function returnToChart() {
    window.scrollTo(0, 0);
    post({ type: 'rct_scroll_top' });
  }
  function preloadChart(index) {
    if (index >= items.length) return;
    var id = items[index].chartId;
    if (chartPreloads[id]) return;
    var preload = new Image();
    preload.decoding = 'async';
    preload.src = 'charts/' + id + '.png';
    chartPreloads[id] = preload;
  }
  function setAnswersEnabled(enabled) {
    var inputs = elOptions.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) inputs[i].disabled = !enabled;
    elOptions.style.opacity = enabled ? '' : '0.55';
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  // Filter only the explicit abstention in these outcome pages. Keep the shared
  // bank and original option letters intact (training and legacy scoring use them).
  // Match the base English text so the filter is independent of the DE overlay.
  function answerOptions(item) {
    return item.options.filter(function (o) { return o.text !== "I don't know"; });
  }

  // ── Render current item ──
  function renderItem() {
    var item = items[currentIndex];
    selectedResponse = null;
    selectedConfidence = null;
    answerRt = null;
    phase = 'answer';
    chartReady = false;
    elInstructions.textContent = L.instructions;
    elOptions.classList.remove('locked');
    if (elConfidence.open) elConfidence.close();
    elConfidenceSlider.value = '4';
    elConfidenceSlider.setAttribute('data-unanswered', '');
    elConfidenceSlider.setAttribute('aria-valuetext', L.unselected);
    elConfidenceValue.textContent = L.unselected;
    elConfidenceNext.disabled = true;
    elNext.textContent = L.confirm;
    elNext.disabled = true;
    elCurrent.textContent = String(currentIndex + 1);
    elProgressFill.style.width = ((currentIndex / items.length) * 100) + '%';

    // Chart image (axis titles + chart; prompt & options cropped off — the prompt is
    // shown as separate text below). Do not disclose the chart type in alt text
    // or the missing-image placeholder: some items ask participants to identify it.
    var alt = LANG === 'DE' ? 'Diagramm' : 'Chart';
    var imgPath = 'charts/' + item.chartId + '.png';
    elChart.innerHTML = '<div class="chart-loading" role="status" aria-live="polite">' +
      '<span class="chart-loading-spinner" aria-hidden="true"></span><span>' +
      (LANG === 'DE' ? 'Diagramm wird geladen…' : 'Loading chart…') + '</span></div>';
    var loadingEl = elChart.firstChild;
    var chartImg = new Image();
    chartImg.alt = alt;
    chartImg.decoding = 'async';
    chartImg.fetchPriority = 'high';
    function startWhenVisible() {
      if (elChart.firstChild !== loadingEl || chartReady) return;
      elChart.replaceChildren(chartImg);
      chartReady = true;
      setAnswersEnabled(true);
      itemStartTime = Date.now();
      startTimer();
      sendHeight();
      preloadChart(currentIndex + 1);
      preloadChart(currentIndex + 2);
    }
    chartImg.addEventListener('load', function () {
      if (chartImg.decode) chartImg.decode().then(startWhenVisible, startWhenVisible);
      else startWhenVisible();
    });
    chartImg.addEventListener('error', function () {
      if (elChart.firstChild !== loadingEl) return;
      elChart.innerHTML = '<div class="chart-placeholder" role="alert"><div class="title">' +
        escHtml(alt) + '</div><div class="hint">' +
        (LANG === 'DE' ? 'Das Diagramm konnte nicht geladen werden. Bitte laden Sie die Seite erneut.' :
          'The chart could not be loaded. Please reload this page.') + '</div></div>';
      sendHeight();
    });

    elQuestion.textContent = loc(item, 'questionText');

    // Substantive options retain their original letters and order.
    var html = '';
    var options = answerOptions(item);
    for (var i = 0; i < options.length; i++) {
      var opt = options[i];
      html += '<li class="option" data-value="' + escAttr(opt.label) + '" onclick="selectOption(this)">';
      html += '<input type="radio" name="answer" id="opt_' + i + '">';
      html += '<label for="opt_' + i + '"><span class="label-key">' + escHtml(opt.label) + '</span>' + escHtml(loc(opt, 'text')) + '</label>';
      html += '</li>';
    }
    elOptions.innerHTML = html;

    // Answers and the timer remain paused until the image has decoded.
    setAnswersEnabled(false);
    elTimer.textContent = '…';
    clearInterval(timerInterval);
    chartImg.src = imgPath;
    sendHeight();
    if (currentIndex > 0) returnToChart();
    if (currentIndex > 0) document.getElementById('question-progress').focus({ preventScroll: true });
  }

  // ── Timer (disabled when TIME_LIMIT <= 0) ──
  function startTimer() {
    clearInterval(timerInterval);
    if (TIME_LIMIT <= 0) { elTimer.style.display = 'none'; return; }
    elTimer.style.display = '';
    timeRemaining = TIME_LIMIT;
    elTimer.textContent = TIME_LIMIT + 's';
    elTimer.className = 'timer';
    timerInterval = setInterval(tickTimer, 1000);
  }
  function tickTimer() {
    if (phase !== 'answer') return;
    timeRemaining--;
    elTimer.textContent = timeRemaining + 's';
    if (timeRemaining <= 5) elTimer.className = 'timer critical';
    else if (timeRemaining <= 10) elTimer.className = 'timer warning';
    else elTimer.className = 'timer';
    if (timeRemaining <= 0) { clearInterval(timerInterval); recordResponse('timeout', true); }
  }

  // ── Selection / submit ──
  window.selectOption = function (el) {
    if (phase !== 'answer' || !chartReady || !elOptions.contains(el)) return;
    var opts = elOptions.querySelectorAll('.option');
    for (var i = 0; i < opts.length; i++) { opts[i].classList.remove('selected'); opts[i].querySelector('input').checked = false; }
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    selectedResponse = el.getAttribute('data-value');
    elNext.disabled = false;
  };
  window.selectConfidence = function (value) {
    if (phase !== 'confidence' || !/^[1-7]$/.test(String(value))) return;
    var n = Number(value);
    selectedConfidence = n;
    elConfidenceSlider.value = String(n);
    elConfidenceSlider.removeAttribute('data-unanswered');
    elConfidenceSlider.setAttribute('aria-valuetext', n + ' ' + L.of + ' 7' + (n === 1 ? ': ' + L.low : n === 7 ? ': ' + L.high : ''));
    elConfidenceValue.textContent = n + ' / 7';
    elConfidenceNext.disabled = false;
  };
  window.submitAnswer = function () {
    if (phase === 'answer') {
      if (!selectedResponse) return;
      clearInterval(timerInterval);
      answerRt = Date.now() - itemStartTime;
      phase = 'confidence';
      confidenceStartTime = Date.now();
      elTimer.style.display = 'none';
      elOptions.classList.add('locked');
      var inputs = elOptions.querySelectorAll('input');
      for (var i = 0; i < inputs.length; i++) inputs[i].disabled = true;
      elInstructions.textContent = L.locked;
      elNext.disabled = true;
      elConfidenceNext.disabled = true;
      elConfidence.showModal();
      document.getElementById('confidence-question').focus();
      sendHeight();
    } else if (phase === 'confidence' && selectedConfidence !== null) {
      recordResponse(selectedResponse, false);
    }
  };

  // ── Record + advance ──
  function recordResponse(response, isTimeout) {
    if (phase !== (isTimeout ? 'answer' : 'confidence')) return;
    phase = 'recording';
    if (elConfidence.open) elConfidence.close();
    var item = items[currentIndex];
    var rt = isTimeout ? Date.now() - itemStartTime : answerRt;
    var confidence = isTimeout ? null : selectedConfidence;
    var confidenceRt = isTimeout ? null : Date.now() - confidenceStartTime;
    var optionTexts = answerOptions(item).map(function (o) { return o.text; });
    responses.push({ itemId: item.id, response: response, rt: rt, timeout: isTimeout, chart_id: item.chartId, format: (item.questionFormat || 'mc'), questionText: item.questionText, options: optionTexts,
      confidence_rating: confidence, confidence_scale: '1-7', confidence_rt_ms: confidenceRt, response_format: 'best_answer_confidence_likert7_v1' });
    post({ type: 'pcp_item_response', itemId: item.id, response: response, rt: rt, timeout: isTimeout, questionText: item.questionText, options: optionTexts,
      confidence_rating: confidence, confidence_scale: '1-7', confidence_rt_ms: confidenceRt, response_format: 'best_answer_confidence_likert7_v1' });
    currentIndex++;
    if (currentIndex < items.length) renderItem(); else finishBlock();
  }

  // ── Finish block ──
  function finishBlock() {
    phase = 'complete';
    clearInterval(timerInterval);
    var totalTime = Date.now() - blockStartTime;
    var answered = responses.filter(function (r) { return r.response !== 'timeout'; }).length;
    var attempted = responses.filter(function (r) { return r.response !== 'omit' && r.response !== 'timeout'; }).length;

    // Build embedded-data object. Responses only — correctness scored offline
    // against PCP_KEY (pcp_scoring.js); no answer key is exposed on this page.
    var ed = {};
    responses.forEach(function (r) {
      // r.itemId already carries the "pcp_" prefix (e.g. "pcp_rem_sa_1"), so do NOT add it again.
      ed[r.itemId + '_response'] = r.response;
      ed[r.itemId + '_rt'] = String(r.rt);
      ed[r.itemId + '_timeout'] = String(r.timeout);
    });
    ed['pcp_' + BLOCK + '_completed'] = 'true';
    ed['pcp_' + BLOCK + '_total_time'] = String(totalTime);
    ed['pcp_' + BLOCK + '_items_answered'] = String(answered);
    ed['pcp_' + BLOCK + '_attempted'] = String(attempted);
    ed['pcp_' + BLOCK + '_order'] = itemOrder.join(',');
    ed['pcp_' + BLOCK + '_total'] = String(items.length);
    ed['pcp_' + BLOCK + '_lang'] = LANG;
    // Authoritative blob for offline scoring (robust to shuffle): id + chosen label per item.
    ed['pcp_' + BLOCK + '_responses'] = JSON.stringify(responses.map(function (r) {
      return { id: r.itemId, chart_id: r.chart_id, format: r.format, answer: r.response, rt_ms: r.rt, timeout: r.timeout,
        confidence_rating: r.confidence_rating, confidence_scale: r.confidence_scale, confidence_rt_ms: r.confidence_rt_ms, response_format: r.response_format };
    }));

    post({ type: 'pcp_block_complete', block: BLOCK, total: items.length, itemsAnswered: answered,
           attempted: attempted, totalTime: totalTime, order: itemOrder, embeddedData: ed });
    post({ type: 'rct_complete' });

    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('complete-screen').style.display = 'block';
    post({ type: 'rct_height', value: 480 });
    returnToChart();
  }

  // ── Chart zoom ──
  window.closeZoom = function () { document.getElementById('zoom-overlay').classList.remove('active'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeZoom(); });
  elChart.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') {
      document.getElementById('zoom-img').src = e.target.src;
      document.getElementById('zoom-img').alt = e.target.alt;
      document.getElementById('zoom-overlay').classList.add('active');
    }
  });

  // ── Start ──
  renderItem();
  post({ type: 'rct_ready' });
  window.addEventListener('message', function (event) {
    if (event.source === window.parent && event.data && event.data.type === 'rct_ready_probe') post({ type: 'rct_ready' });
  });
})();
</script>

<div id="zoom-overlay" onclick="if(event.target===this)closeZoom()" role="dialog" aria-modal="true" aria-label="Zoomed chart">
  <button id="zoom-close" onclick="closeZoom()" aria-label="Close">&times;</button>
  <img id="zoom-img" src="" alt="">
</div>
</body>
</html>
