<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCP Post-test 2 (delayed)</title>
<!--
  PCP LITERACY POST-TEST 2 — delayed, UNAIDED retention measure (secondary outcome).
  =============================================================================
  Self-contained renderer, hosted on GitHub Pages and embedded in Qualtrics via
    <iframe src="https://bruno20033.github.io/thesis-rct/qualtrics-pcp-posttest2.html?pid=${e://Field/ResponseID}">
  with qualtrics-pcp-js.js pasted into the question's "Add JavaScript" panel.

  Shows the 16 block:"posttest2" items from pcp_items_data.js (4 per Bloom level),
  one at a time, NO tool access. Records the participant's chosen option LETTER,
  reaction time, and timeout flag per item, then posts them to the bridge.

  NO ANSWER KEY ships here on purpose — this page is participant-facing and must
  not expose correct answers. Correctness is scored OFFLINE from pcp_<id>_response
  against PCP_KEY in pcp_scoring.js. English-only (the BTPL instrument is English).
  =============================================================================
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #fff; color: #1a1a2e; padding: 24px; max-width: 820px; margin: 0 auto; }

  /* Progress & Timer */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .progress { font-size: 0.9rem; color: #495057; font-weight: 600; }
  .progress-bar { width: 200px; height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: #228be6; transition: width 0.3s; }
  .timer { font-size: 1.1rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; background: #f1f3f5; }
  .timer.warning { background: #fff3bf; color: #e67700; }
  .timer.critical { background: #ffe3e3; color: #c92a2a; }

  /* Chart */
  .chart-container { text-align: center; margin-bottom: 24px; }
  .chart-container img { max-width: 760px; width: 100%; border: 1px solid #dee2e6; border-radius: 8px; cursor: zoom-in; }
  .chart-placeholder { max-width: 760px; margin: 0 auto; padding: 60px 40px; background: #f8f9fa;
                        border: 2px dashed #ced4da; border-radius: 8px; color: #868e96; text-align: center; }
  .chart-placeholder .title { font-size: 1.1rem; font-weight: 600; color: #495057; margin-bottom: 8px; }
  .chart-placeholder .hint { font-size: 0.85rem; }

  /* Zoom overlay */
  #zoom-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
                  z-index: 9999; align-items: center; justify-content: center; }
  #zoom-overlay.active { display: flex; }
  #zoom-overlay img { max-width: 95vw; max-height: 92vh; object-fit: contain; border-radius: 4px;
                      box-shadow: 0 4px 32px rgba(0,0,0,0.5); }
  #zoom-close { position: fixed; top: 16px; right: 20px; font-size: 2.5rem; color: #fff;
                cursor: pointer; line-height: 1; background: none; border: none; padding: 0; opacity: 0.85; }
  #zoom-close:hover { opacity: 1; }

  /* Question */
  .question-text { font-size: 1.15rem; line-height: 1.5; margin-bottom: 20px; font-weight: 500; }

  /* Options */
  .options { list-style: none; margin-bottom: 20px; }
  .option { display: flex; align-items: center; padding: 12px 16px; margin-bottom: 8px;
            border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  .option:hover { border-color: #228be6; background: #f0f7ff; }
  .option.selected { border-color: #228be6; background: #e7f5ff; }
  .option input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
  .option label { cursor: pointer; flex: 1; font-size: 1rem; }
  .option .label-key { font-weight: 700; color: #228be6; margin-right: 8px; }

  /* Next button */
  .btn-next { display: block; margin: 0 auto; padding: 12px 48px; font-size: 1rem; font-weight: 600;
              background: #228be6; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .btn-next:hover { background: #1c7ed6; }
  .btn-next:disabled { background: #adb5bd; cursor: not-allowed; }

  /* Completion */
  .complete-screen { text-align: center; padding: 60px 20px; }
  .complete-screen h2 { font-size: 1.5rem; margin-bottom: 12px; color: #2b8a3e; }
  .complete-screen p { color: #495057; font-size: 1rem; }
</style>
</head>
<body>

<div id="quiz-container">
  <div class="top-bar">
    <div>
      <div class="progress">Question <span id="q-current">1</span> of <span id="q-total">?</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="timer" class="timer"></div>
  </div>

  <div id="chart-area" class="chart-container"></div>
  <div id="question-text" class="question-text"></div>
  <ul id="options-list" class="options"></ul>
  <button id="btn-next" class="btn-next" disabled onclick="submitAnswer()">Next</button>
</div>

<div id="complete-screen" class="complete-screen" style="display:none">
  <h2>Block Complete</h2>
  <p>Your responses have been recorded. Please wait…</p>
</div>

<script src="pcp_items_data.js"></script>
<script>
(function () {
  // ── Configuration ──
  var BLOCK = 'posttest2';
  // Per-item time cap in seconds. TUNABLE: accuracy is the primary outcome, so
  // this is generous to avoid truncating slow-but-correct reads. Set to 0 to
  // disable the timer entirely (fully untimed; reaction time is still recorded).
  var TIME_LIMIT = 90;

  var params = new URLSearchParams(window.location.search);
  var pid = params.get('pid') || 'default';

  // ── Items for this block ──
  var items = (typeof PCP_ITEMS !== 'undefined' ? PCP_ITEMS : []).filter(function (i) { return i.block === BLOCK; });
  if (items.length === 0) { document.body.innerHTML = '<p>No items found for block: ' + BLOCK + '</p>'; return; }

  // ── Seeded shuffle (per pid+block) so item order is counterbalanced but reproducible ──
  function seededRandom(seed) { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
  function hashString(str) { var h = 0; for (var i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; } return Math.abs(h); }
  function shuffleArray(arr, seed) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(seededRandom(seed + i) * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  items = shuffleArray(items, hashString(pid + '_' + BLOCK));
  var itemOrder = items.map(function (i) { return i.id; });

  // ── State ──
  var currentIndex = 0, selectedResponse = null, itemStartTime = 0;
  var timerInterval = null, timeRemaining = TIME_LIMIT, blockStartTime = Date.now();
  var responses = [];

  // ── DOM refs ──
  var elCurrent = document.getElementById('q-current');
  var elTotal = document.getElementById('q-total');
  var elProgressFill = document.getElementById('progress-fill');
  var elTimer = document.getElementById('timer');
  var elChart = document.getElementById('chart-area');
  var elQuestion = document.getElementById('question-text');
  var elOptions = document.getElementById('options-list');
  var elNext = document.getElementById('btn-next');
  elTotal.textContent = String(items.length);

  function post(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function sendHeight() { post({ type: 'rct_height', value: document.body.scrollHeight }); }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  // ── Render current item ──
  function renderItem() {
    var item = items[currentIndex];
    selectedResponse = null;
    elNext.disabled = true;
    elCurrent.textContent = String(currentIndex + 1);
    elProgressFill.style.width = ((currentIndex / items.length) * 100) + '%';

    // Chart (chart-only image; alt = chart type)
    var alt = item.chartType || 'chart';
    var imgPath = 'charts/' + item.chartId + '.png';
    elChart.innerHTML = '<img src="' + imgPath + '" alt="' + escAttr(alt) + '" ' +
      'onerror="this.parentNode.innerHTML=\'<div class=chart-placeholder><div class=title>' + escHtml(alt) +
      '</div><div class=hint>[chart image not loaded — charts/' + escHtml(item.chartId) + '.png]</div></div>\'">';

    elQuestion.textContent = item.questionText;

    // Options — render the instrument's own options only (no appended "don't know").
    var html = '';
    for (var i = 0; i < item.options.length; i++) {
      var opt = item.options[i];
      html += '<li class="option" data-value="' + escAttr(opt.label) + '" onclick="selectOption(this)">';
      html += '<input type="radio" name="answer" id="opt_' + i + '">';
      html += '<label for="opt_' + i + '"><span class="label-key">' + escHtml(opt.label) + '</span>' + escHtml(opt.text) + '</label>';
      html += '</li>';
    }
    elOptions.innerHTML = html;

    // Timer
    itemStartTime = Date.now();
    startTimer();

    sendHeight();
    var chartImg = elChart.querySelector('img');
    if (chartImg) chartImg.addEventListener('load', sendHeight);
  }

  // ── Timer (disabled when TIME_LIMIT <= 0) ──
  function startTimer() {
    clearInterval(timerInterval);
    if (TIME_LIMIT <= 0) { elTimer.style.display = 'none'; return; }
    elTimer.style.display = '';
    timeRemaining = TIME_LIMIT;
    elTimer.textContent = TIME_LIMIT + 's';
    elTimer.className = 'timer';
    timerInterval = setInterval(tickTimer, 1000);
  }
  function tickTimer() {
    timeRemaining--;
    elTimer.textContent = timeRemaining + 's';
    if (timeRemaining <= 5) elTimer.className = 'timer critical';
    else if (timeRemaining <= 10) elTimer.className = 'timer warning';
    else elTimer.className = 'timer';
    if (timeRemaining <= 0) { clearInterval(timerInterval); recordResponse('timeout', true); }
  }

  // ── Selection / submit ──
  window.selectOption = function (el) {
    var opts = elOptions.querySelectorAll('.option');
    for (var i = 0; i < opts.length; i++) { opts[i].classList.remove('selected'); opts[i].querySelector('input').checked = false; }
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    selectedResponse = el.getAttribute('data-value');
    elNext.disabled = false;
  };
  window.submitAnswer = function () { if (!selectedResponse) return; clearInterval(timerInterval); recordResponse(selectedResponse, false); };

  // ── Record + advance ──
  function recordResponse(response, isTimeout) {
    var item = items[currentIndex];
    var rt = Date.now() - itemStartTime;
    var optionTexts = item.options.map(function (o) { return o.text; });
    responses.push({ itemId: item.id, response: response, rt: rt, timeout: isTimeout, questionText: item.questionText, options: optionTexts });
    post({ type: 'pcp_item_response', itemId: item.id, response: response, rt: rt, timeout: isTimeout, questionText: item.questionText, options: optionTexts });
    currentIndex++;
    if (currentIndex < items.length) renderItem(); else finishBlock();
  }

  // ── Finish block ──
  function finishBlock() {
    clearInterval(timerInterval);
    var totalTime = Date.now() - blockStartTime;
    var answered = responses.filter(function (r) { return r.response !== 'timeout'; }).length;
    var attempted = responses.filter(function (r) { return r.response !== 'omit' && r.response !== 'timeout'; }).length;

    // Build embedded-data object. Responses only — correctness scored offline
    // against PCP_KEY (pcp_scoring.js); no answer key is exposed on this page.
    var ed = {};
    responses.forEach(function (r) {
      // r.itemId already carries the "pcp_" prefix (e.g. "pcp_rem_sa_1"), so do NOT add it again.
      ed[r.itemId + '_response'] = r.response;
      ed[r.itemId + '_rt'] = String(r.rt);
      ed[r.itemId + '_timeout'] = String(r.timeout);
    });
    ed['pcp_' + BLOCK + '_completed'] = 'true';
    ed['pcp_' + BLOCK + '_total_time'] = String(totalTime);
    ed['pcp_' + BLOCK + '_items_answered'] = String(answered);
    ed['pcp_' + BLOCK + '_attempted'] = String(attempted);
    ed['pcp_' + BLOCK + '_order'] = itemOrder.join(',');
    ed['pcp_' + BLOCK + '_total'] = String(items.length);
    // Authoritative blob for offline scoring (robust to shuffle): id + chosen label per item.
    ed['pcp_' + BLOCK + '_responses'] = JSON.stringify(responses.map(function (r) { return { id: r.itemId, answer: r.response, rt: r.rt, timeout: r.timeout }; }));

    post({ type: 'pcp_block_complete', block: BLOCK, total: items.length, itemsAnswered: answered,
           attempted: attempted, totalTime: totalTime, order: itemOrder, embeddedData: ed });
    post({ type: 'rct_complete' });

    document.getElementById('quiz-container').style.display = 'none';
    document.getElementById('complete-screen').style.display = 'block';
    sendHeight();
  }

  // ── Chart zoom ──
  window.closeZoom = function () { document.getElementById('zoom-overlay').classList.remove('active'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeZoom(); });
  elChart.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG') {
      document.getElementById('zoom-img').src = e.target.src;
      document.getElementById('zoom-img').alt = e.target.alt;
      document.getElementById('zoom-overlay').classList.add('active');
    }
  });

  // ── Start ──
  renderItem();
  sendHeight();
})();
</script>

<div id="zoom-overlay" onclick="if(event.target===this)closeZoom()" role="dialog" aria-modal="true" aria-label="Zoomed chart">
  <button id="zoom-close" onclick="closeZoom()" aria-label="Close">&times;</button>
  <img id="zoom-img" src="" alt="">
</div>
</body>
</html>
